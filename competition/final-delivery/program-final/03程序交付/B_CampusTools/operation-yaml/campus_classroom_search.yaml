                        type: string
                        description: class/teacher/room/course/user 等实体类型
                      id:
                        type: string
                        description: 数据集中实体唯一 ID
                      name:
                        type: string
                        description: 实体显示名（如 教师009）
                    required: []
                    description: 解析后的校园实体（与请求 entityType 对应，day_plan 固定为 user）
                  query:
                    type: object
                    properties:
                      week:
                        type: integer
                        description: ''
                      weekday:
                        type: integer
                        description: ''
                      date:
                        type: string
                        description: ''
                      campus:
                        type: string
                        description: 空教室查询的校区名
                      periodStart:
                        type: integer
                        description: ''
                      periodEnd:
                        type: integer
                        description: ''
                    required: []
                    description: 本次查询的确定性时间/过滤上下文回显
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        roomId:
                          type: string
                          description: ''
                        roomName:
                          type: string
                          description: ''
                        building:
                          type: string
                          description: ''
                        campusId:
                          type: string
                          description: ''
                        campusName:
                          type: string
                          description: ''
                        capacity:
                          type: integer
                          description: ''
                        type:
                          type: string
                          description: 教室类型（体育场地被排除）
                        freePeriodStart:
                          type: integer
                          description: ''
                        freePeriodEnd:
                          type: integer
                          description: ''
                        periodText:
                          type: string
                          description: 如 第5-6节
                        date:
                          type: string
                          description: YYYY-MM-DD
                    description: ''
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: 动作类型：open_widget / sys.chat
                        cardType:
                          type: string
                          description: >-
                            open_widget
                            的卡片类型：schedule/classroom/conflict/day_plan
                        label:
                          type: string
                          description: 动作文案
                        intent:
                          type: string
                          description: sys.chat 的意图标识
                        query:
                          type: string
                          description: sys.chat 的预填查询
                        week:
                          type: integer
                          description: sys.chat 关联的教学周
                    description: ''
                  evidence:
                    type: object
                    properties:
                      dataVersion:
                        type: string
                        description: ''
                      dataHash:
                        type: string
                        description: ''
                      source:
                        type: string
                        description: 计算来源（固定 campus-tools-mcp）
                      computedAt:
                        type: string
                        description: 计算时间 ISO 字符串
                      verified:
                        type: boolean
                        description: 是否通过确定性校验；失败路径为 false
                      note:
                        type: string
                        description: EMPTY_RESULT 等附加标记
                      derivation:
                        type: string
                        description: overview 的派生过程说明
                      preparationPeriodLessonCount:
                        type: integer
                        description: overview 准备期课程数（固定 0）
                    required: []
                    description: 可核查证据：动态事实全部来自当前匿名数据集的确定性计算
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: >-
                          MISSING_PARAM / INVALID_PARAM / ENTITY_NOT_FOUND /
                          AMBIGUOUS_ENTITY / OUT_OF_RANGE / INTERNAL 等
                      message:
                        type: string
                        description: 中文错误说明
                      details:
                        type: object
                        properties: {}
                        required: []
                        description: 附加细节（如候选列表）
                    required: []
                    description: 确定性错误结构，供 ADP 工作流分支判断
                  decision:
                    type: object
                    properties:
                      status:
                        type: string
                        description: ''
                      preferred:
