                              description: ''
                            reasons:
                              type: array
                              items:
                                type: string
                              description: ''
                        description: ''
                      reasons:
                        type: array
                        items:
                          type: string
                        description: ''
                      tradeoffs:
                        type: array
                        items:
                          type: object
                          properties:
                            label:
                              type: string
                              description: ''
                            reasons:
                              type: array
                              items:
                                type: string
                              description: ''
                        description: ''
                      nextActions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: ''
                            type:
                              type: string
                              description: ''
                            label:
                              type: string
                              description: ''
                            payload:
                              type: object
                              properties:
                                query:
                                  type: string
                                  description: ''
                              required: []
                              description: ''
                        description: ''
                      receipt:
                        type: object
                        properties:
                          receiptVersion:
                            type: string
                            description: ''
                          decisionId:
                            type: string
                            description: ''
                          recommendation:
                            type: object
                            properties:
                              label:
                                type: string
                                description: ''
                              reasons:
                                type: array
                                items:
                                  type: string
                                description: ''
                            required: []
                            description: ''
                          alternatives:
                            type: array
                            items:
                              type: object
                              properties:
                                label:
                                  type: string
                                  description: ''
                                reasons:
                                  type: array
                                  items:
                                    type: string
                                  description: ''
                            description: ''
                          nextAction:
                            type: object
                            properties:
                              label:
                                type: string
                                description: ''
                              query:
                                type: string
                                description: ''
                            required: []
                            description: ''
                          verified:
                            type: boolean
                            description: ''
                          decision:
                            type: string
                            description: ''
                        required: []
                        description: ''
                      resultCard:
                        type: object
                        properties:
                          version:
                            type: string
                            description: ''
                          variant:
                            type: string
                            description: ''
                          status:
                            type: string
                            description: ''
                          layoutMode:
                            type: string
                            description: ''
                          title:
                            type: string
                            description: ''
                          subtitle:
                            type: string
                            description: ''
                          summary:
                            type: string
                            description: ''
                          context:
                            type: string
                            description: ''
                          verified:
                            type: boolean
                            description: ''
                          sections:
                            type: array
                            items:
                              type: object
                              properties:
                                title:
                                  type: string
                                  description: ''
                                rows:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      label:
                                        type: string
                                        description: ''
                                      value:
                                        type: string
                                        description: ''
                                      hint:
                                        type: string
                                        description: ''
                                  description: ''
                            description: ''
                          actions:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: ''
                                type:
                                  type: string
                                  description: ''
                                label:
                                  type: string
                                  description: ''
                                payload:
                                  type: object
                                  properties:
                                    query:
                                      type: string
                                      description: ''
                                  required: []
                                  description: ''
                            description: ''
                          displayMeta:
                            type: object
                            properties: {}
                            required: []
                            description: ''
                          weekBoardTitle:
                            type: string
                            description: ''
                          weekBoardSubtitle:
                            type: string
                            description: ''
                          days:
                            type: array
                            items:
                              type: object
                              properties: {}
                            description: ''
                        required: []
                        description: 现有小序校园智序 result-card 的脱敏投影
                    required: []
                    description: >-
                      服务端基于当前 verified tool candidates 生成的脱敏确定性决策；原 facts/items
                      保持不变
          description: 成功的响应
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                campus:
                  type: string
                  description: 校区名（如 校区A / 校区B / 校区C）；缺失时全校区检索
                date:
                  type: string
                  description: 日期 YYYY-MM-DD；同时给出 weekday 且不一致时报 INVALID_PARAM
                week:
                  type: integer
                  description: 教学周 1-20；缺失时按当前教学周推断；ADP 平台归一化为 0 时视为未指定
                weekday:
                  type: integer
                  description: 星期 1-7（1=周一）；ADP 平台归一化为 0 时视为未指定，不得解释为「星期0」
                periodStart:
                  type: integer
                  description: 起始节次 1-10；ADP 平台归一化为 0 时视为未指定，不得解释为「节次0」（否则会把全部课程过滤成空结果）
                periodEnd:
                  type: integer
                  description: 结束节次 1-10（>= periodStart）；ADP 平台归一化为 0 时视为未指定
                minCapacity:
                  type: integer
                  description: 最小容量（>=1），只返回容量不小于该值的教室
                building:
                  type: string
                  description: 教学楼名称过滤（可选）
                consecutivePeriods:
                  type: integer
                  description: 连排节数 1-10，教室空闲时段需连续覆盖该节数
                decisionPreferences:
                  type: object
                  properties:
                    preferEarlier:
                      type: boolean
                      description: 更早时段优先
                    preferLarger:
                      type: boolean
                      description: 更大容量优先
                    preferSameCampus:
                      type: boolean
                      description: 同校区优先（仅在已有规范校区约束时生效）
                    preferWeekdays:
                      type: array
                      items:
                        type: integer
                      description: 优先星期集合
                  required: []
                  description: 结构化 soft preference；服务端只接受白名单字段并确定性评分
              required:
                - periodStart
                - periodEnd
