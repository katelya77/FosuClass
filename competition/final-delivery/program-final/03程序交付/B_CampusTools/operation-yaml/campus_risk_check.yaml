openapi: 3.0.0
info:
  title: 校园智序-CampusTools
  description: >-
    校园智序&middot; 小序的确定性教学数据工具集，提供课表、空教室、风险检查、一日规划和校园教学态势查询。所有动态校园事实均来自
    competition-demo-v3 的确定性计算结果，供 Multi-Agent 专业 Agent 调用。
  version: 1.0.0
servers:
  - url: https://cloud1-d3g17rpe7566d3d5c-1442900641.ap-shanghai.app.tcloudbase.com
paths:
  /campusflow-adp-tools/api/campus_risk_check:
    post:
      operationId: campus_risk_check
      summary: 风险检查：self（单对象）或 compare（双对象）
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: ''
                  queryId:
                    type: string
                    description: ''
                  dataVersion:
                    type: string
                    description: ''
                  resolvedEntity:
                    type: object
                    properties:
                      type:
                        type: string
                        description: class/teacher/room/course/user 等实体类型
                      id:
                        type: string
                        description: 数据集中实体唯一 ID
                      name:
                        type: string
                        description: 实体显示名（如 教师009）
                    required: []
                    description: 解析后的校园实体（与请求 entityType 对应，day_plan 固定为 user）
                  query:
                    type: object
                    properties:
                      week:
                        type: integer
                        description: ''
                      weekday:
                        type: integer
                        description: ''
                      date:
                        type: string
                        description: ''
                      campus:
                        type: string
                        description: 空教室查询的校区名
                      periodStart:
                        type: integer
                        description: ''
                      periodEnd:
                        type: integer
                        description: ''
                    required: []
                    description: 本次查询的确定性时间/过滤上下文回显
                  compared:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: class/teacher/room/course/user 等实体类型
                        id:
                          type: string
                          description: 数据集中实体唯一 ID
                        name:
                          type: string
                          description: 实体显示名（如 教师009）
                    description: 被比较的两个实体（self 模式为同一实体的确定性复制）
                  rushWarnings:
                    type: array
                    items:
                      type: object
                      properties:
                        entity:
                          type: string
                          description: 发生赶场的实体名
                        weekday:
