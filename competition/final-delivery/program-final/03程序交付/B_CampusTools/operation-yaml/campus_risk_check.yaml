                              description: ''
                            courseName:
                              type: string
                              description: ''
                            teachers:
                              type: array
                              items:
                                type: string
                              description: 任课教师名列表
                            classes:
                              type: array
                              items:
                                type: string
                              description: 上课班级名列表
                            roomId:
                              type: string
                              description: ''
                            roomName:
                              type: string
                              description: ''
                            building:
                              type: string
                              description: ''
                            campusId:
                              type: string
