                  properties:
                    preferEarlier:
                      type: boolean
                      description: 更早时段优先
                    preferLarger:
                      type: boolean
                      description: 更大容量优先
                    preferSameCampus:
                      type: boolean
                      description: 同校区优先（仅在已有规范校区约束时生效）
                    preferWeekdays:
                      type: array
                      items:
                        type: integer
                      description: 优先星期集合
                  required: []
                  description: 结构化 soft preference；服务端只接受白名单字段并确定性评分
              required:
                - target
