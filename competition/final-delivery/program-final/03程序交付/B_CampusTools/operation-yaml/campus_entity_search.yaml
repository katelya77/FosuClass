openapi: 3.0.0
info:
  title: 校园智序-CampusTools
  description: >-
    校园智序&middot; 小序的确定性教学数据工具集，提供课表、空教室、风险检查、一日规划和校园教学态势查询。所有动态校园事实均来自
    competition-demo-v3 的确定性计算结果，供 Multi-Agent 专业 Agent 调用。
  version: 1.0.0
servers:
  - url: https://cloud1-d3g17rpe7566d3d5c-1442900641.ap-shanghai.app.tcloudbase.com
paths:
  /campusflow-adp-tools/api/campus_entity_search:
    post:
      operationId: campus_entity_search
      summary: 校园实体搜索/清单（教师/班级/教室/课程/校区/学院）
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 统一成功标志
                  queryId:
                    type: string
                    description: 查询 ID
                  dataVersion:
                    type: string
                    description: 数据版本标识
                  resolvedEntity:
                    type: object
                    properties:
                      type:
                        type: string
                        description: class/teacher/room/course/user 等实体类型
                      id:
                        type: string
                        description: 数据集中实体唯一 ID
                      name:
                        type: string
                        description: 实体显示名（如 教师009）
                    required: []
                    description: 解析后的校园实体（与请求 entityType 对应，day_plan 固定为 user）
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: 实体 id
                        name:
                          type: string
                          description: 实体名称
                        type:
                          type: string
                          description: 实体类型
                        matchType:
                          type: string
                          description: 确定性匹配类型
                        campusId:
                          type: string
                          description: 校区 id（room 类型携带）
                        campusName:
                          type: string
                          description: 校区名称
                        building:
                          type: string
                          description: 楼栋（room 类型携带）
                        capacity:
                          type: integer
                          description: 教室容量（room 类型携带）
                        roomType:
                          type: string
                          description: 教室类型（room 类型携带）
                        collegeId:
                          type: string
                          description: 学院 id（class/course 类型携带）
                        collegeName:
                          type: string
                          description: 学院名称
                        classId:
                          type: string
                          description: 班级 id（teacher 类型携带）
                        className:
                          type: string
                          description: 班级名称（teacher 类型携带）
                    description: 实体搜索结果条目
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: 动作类型：open_widget / sys.chat
                        cardType:
                          type: string
                          description: >-
                            open_widget
                            的卡片类型：schedule/classroom/conflict/day_plan
                        label:
                          type: string
                          description: 动作文案
                        intent:
                          type: string
                          description: sys.chat 的意图标识
                        query:
                          type: string
                          description: sys.chat 的预填查询
                        week:
                          type: integer
                          description: sys.chat 关联的教学周
                    description: 可执行动作（当前为空数组）
                  evidence:
                    type: object
                    properties:
                      dataVersion:
                        type: string
                        description: ''
                      dataHash:
                        type: string
                        description: ''
                      source:
                        type: string
                        description: 计算来源（固定 campus-tools-mcp）
                      computedAt:
                        type: string
                        description: 计算时间 ISO 字符串
                      verified:
                        type: boolean
                        description: 是否通过确定性校验；失败路径为 false
                      note:
                        type: string
                        description: EMPTY_RESULT 等附加标记
                      derivation:
                        type: string
                        description: overview 的派生过程说明
                      preparationPeriodLessonCount:
                        type: integer
                        description: overview 准备期课程数（固定 0）
                    required: []
                    description: 可核查证据：动态事实全部来自当前匿名数据集的确定性计算
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: >-
                          MISSING_PARAM / INVALID_PARAM / ENTITY_NOT_FOUND /
                          AMBIGUOUS_ENTITY / OUT_OF_RANGE / INTERNAL 等
                      message:
                        type: string
                        description: 中文错误说明
                      details:
                        type: object
                        properties: {}
                        required: []
                        description: 附加细节（如候选列表）
                    required: []
                    description: 确定性错误结构，供 ADP 工作流分支判断
                  query:
                    type: object
                    properties:
                      entityType:
                        type: string
                        description: 实体类型（null 表示未指定）
                      keyword:
                        type: string
                        description: 搜索关键词（null 表示清单）
                      campus:
                        type: string
                        description: 校区名称（null 表示未过滤）
                      college:
                        type: string
                        description: 学院（null 表示未过滤）
                      limit:
                        type: integer
                        description: 返回上限
                    required: []
                    description: 回显查询条件
                  summary:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: 命中总数
                      returned:
                        type: integer
                        description: 实际返回条数
                      matchTypes:
                        type: array
                        items:
                          type: string
                        description: 返回条目的匹配类型集合
                    required: []
                    description: 实体搜索汇总
          description: 成功的响应
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entityType:
                  type: string
                  description: 实体类型（可选，缩小搜索范围）
                keyword:
                  type: string
                  description: 搜索关键词（可选，空则返回清单）
                campus:
                  type: string
                  description: 校区A / 校区B（可选，对支持校区字段的实体过滤）
                college:
                  type: string
                  description: 学院 id 或名称（可选，对支持学院字段的实体过滤）
                limit:
                  type: integer
                  description: 返回上限，默认 20
