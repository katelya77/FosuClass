openapi: 3.0.0
info:
  title: 校园智序-CampusTools
  description: >-
    校园智序&middot; 小序的确定性教学数据工具集，提供课表、空教室、风险检查、一日规划和校园教学态势查询。所有动态校园事实均来自
    competition-demo-v3 的确定性计算结果，供 Multi-Agent 专业 Agent 调用。
  version: 1.0.0
servers:
  - url: https://cloud1-d3g17rpe7566d3d5c-1442900641.ap-shanghai.app.tcloudbase.com
paths:
  /campusflow-adp-tools/api/campus_academic_context:
    post:
      operationId: campus_academic_context
      summary: 教学周/学期/节次时间上下文（Temporal Semantic Core）
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 统一成功标志
                  queryId:
                    type: string
                    description: 查询 ID
                  dataVersion:
                    type: string
                    description: 数据版本标识
                  resolvedEntity:
                    type: object
                    properties:
                      type:
                        type: string
                        description: class/teacher/room/course/user 等实体类型
                      id:
                        type: string
                        description: 数据集中实体唯一 ID
                      name:
                        type: string
                        description: 实体显示名（如 教师009）
                    required: []
                    description: 解析后的校园实体（与请求 entityType 对应，day_plan 固定为 user）
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        resolvedDate:
                          type: string
                          description: 解析后的日期 YYYY-MM-DD（无法解析时为 null）
                        date:
                          type: string
                          description: 解析后的日期（与 resolvedDate 一致，向后兼容）
                        week:
                          type: integer
                          description: 教学周 1..20（学期外为 null）
                        weekday:
                          type: integer
                          description: 星期 1..7
                        weekdayName:
                          type: string
                          description: 星期名称，如 周一
                        inSemester:
                          type: boolean
                          description: 是否在学期内（开学前/学期后为 false）
                        semester:
                          type: object
                          properties:
                            id:
                              type: string
                              description: 学期 id
                            name:
                              type: string
                              description: 学期名称
                            startDate:
                              type: string
                              description: 开学日期 YYYY-MM-DD
                            totalWeeks:
                              type: integer
                              description: 教学周总数
                          required: []
                          description: 学期元信息
                        periods:
                          type: array
                          items:
                            type: object
                            properties:
                              period:
                                type: integer
                                description: 节次序号 1..10
                              start:
                                type: string
                                description: 开始时间 HH:mm
                              end:
                                type: string
                                description: 结束时间 HH:mm
                          description: 节次时间轴
                        baseDate:
                          type: string
                          description: 本次解析使用的基准日期
                        resolutionSource:
                          type: string
                          description: 解析来源（intent kind 或口语来源标记）
                        temporalContext:
                          type: object
                          properties:
                            referenceDate:
                              type: string
                              description: 参考日期（可为 null）
                            semesterId:
                              type: string
                              description: 学期 id（可为 null）
                            inSemester:
                              type: boolean
                              description: 是否在学期内
                            currentAcademicWeek:
                              type: integer
                              description: 当前教学周（可为 null）
                            resolvedDate:
                              type: string
                              description: 解析后日期（可为 null）
                            resolvedWeek:
                              type: integer
                              description: 解析后教学周（可为 null）
                            resolvedWeekStart:
                              type: integer
                              description: 周窗口起点（可为 null）
                            resolvedWeekEnd:
                              type: integer
                              description: 周窗口终点（可为 null）
                            resolutionKind:
                              type: string
                              description: 解析类型（absolute/future_weeks/... 或 none）
                            note:
                              type: string
                              description: 补充说明（可选）
                          required: []
                          description: Temporal Semantic Core 结构化上下文（内部协议）
                    description: 教学周/学期上下文条目
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: 动作类型：open_widget / sys.chat
                        cardType:
                          type: string
                          description: >-
                            open_widget
                            的卡片类型：schedule/classroom/conflict/day_plan
                        label:
                          type: string
                          description: 动作文案
                        intent:
                          type: string
                          description: sys.chat 的意图标识
                        query:
                          type: string
                          description: sys.chat 的预填查询
                        week:
                          type: integer
                          description: sys.chat 关联的教学周
                    description: 可执行动作（当前为空数组）
                  evidence:
                    type: object
                    properties:
                      dataVersion:
                        type: string
                        description: ''
                      dataHash:
                        type: string
                        description: ''
                      source:
                        type: string
                        description: 计算来源（固定 campus-tools-mcp）
                      computedAt:
                        type: string
                        description: 计算时间 ISO 字符串
                      verified:
                        type: boolean
                        description: 是否通过确定性校验；失败路径为 false
                      note:
                        type: string
                        description: EMPTY_RESULT 等附加标记
                      derivation:
                        type: string
                        description: overview 的派生过程说明
                      preparationPeriodLessonCount:
                        type: integer
                        description: overview 准备期课程数（固定 0）
                    required: []
                    description: 可核查证据：动态事实全部来自当前匿名数据集的确定性计算
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: >-
                          MISSING_PARAM / INVALID_PARAM / ENTITY_NOT_FOUND /
                          AMBIGUOUS_ENTITY / OUT_OF_RANGE / INTERNAL 等
                      message:
                        type: string
                        description: 中文错误说明
                      details:
                        type: object
                        properties: {}
                        required: []
                        description: 附加细节（如候选列表）
                    required: []
                    description: 确定性错误结构，供 ADP 工作流分支判断
          description: 成功的响应
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                intent:
                  type: object
                  properties:
                    kind:
                      type: string
                      description: intent 类型
                    date:
                      type: string
                      description: 绝对日期 YYYY-MM-DD
                    offset:
                      type: integer
                      description: 相对偏移（天数/周数，随 kind 语义）
                    weekday:
                      type: integer
                      description: 星期 1..7
                    week:
                      type: integer
                      description: 教学周 1..20
                    weekStart:
                      type: integer
                      description: 周窗口起点
                    weekEnd:
                      type: integer
                      description: 周窗口终点
                    count:
                      type: integer
                      description: 未来/最近 N 个教学周
                  required: []
                  description: 结构化 temporal intent（对象或 JSON 字符串）
                date:
                  type: string
                  description: 显式日期 YYYY-MM-DD（优先级最高）
                dateText:
                  type: string
                  description: 今天/明天/后天/本周X/这周X/下周X/第N周周X/YYYY-MM-DD
                baseDate:
                  type: string
                  description: 评测固定基准日期；缺省使用 Asia/Shanghai 当前日期
