<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#173f35" />
    <title>校园任务结果卡</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="demo-shell">
      <header class="demo-head">
        <div>
          <p class="demo-kicker">CAMPUS TASK / VERIFIED OUTPUT</p>
          <h1>校园任务结果卡</h1>
        </div>
        <nav class="demo-switcher" aria-label="卡片样例">
          <button type="button" data-demo="schedule" aria-pressed="true">课表</button>
          <button type="button" data-demo="classroom">空教室</button>
          <button type="button" data-demo="conflict">冲突</button>
          <button type="button" data-demo="day_plan">计划</button>
          <button type="button" data-demo="choice">候选</button>
          <button type="button" data-demo="error">异常</button>
        </nav>
      </header>
      <section id="campus-task-widget" aria-live="polite"></section>
      <p class="demo-foot">匿名赛事数据 · 不对应任何真实学校或身份</p>
    </main>
    <script src="./widget.js"></script>
    <script src="./sample-results.js"></script>
    <script>
      (() => {
        const samples = window.CampusTaskSamples;
        const root = document.querySelector('#campus-task-widget');
        const buttons = [...document.querySelectorAll('[data-demo]')];
        const render = (type) => {
          CampusTaskWidget.render(root, samples[type]);
          buttons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.demo === type)));
        };
        buttons.forEach((button) => button.addEventListener('click', () => render(button.dataset.demo)));
        render('schedule');
      })();
    </script>
  </body>
</html>
