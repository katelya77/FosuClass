name: Schedule Error UX CI

on:
  pull_request:
    branches: [main]
    paths:
      - "miniprogram/pages/school/**"
      - "miniprogram/services/personalSyncErrorPresenter.js"
      - "miniprogram/services/personalSyncFailureTransition.js"
      - "miniprogram/services/releasePackService.js"
      - "miniprogram/utils/request.js"
      - "miniprogram/utils/storage.js"
      - "tools/test-school-*.js"
      - "tools/test-personal-sync-error-contract.js"
      - "tools/test-personal-sync-auth-error-semantics.js"
      - ".github/workflows/schedule-error-ux-ci.yml"

permissions:
  contents: read

jobs:
  schedule-error-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install fixture test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix server ci --ignore-scripts --no-audit --no-fund
      - name: Check Mini Program compilation and schedule error regressions
        run: |
          node tools/test-miniprogram-compile-preflight.js
          node tools/test-school-network-error-ux.js
          node tools/test-personal-sync-error-contract.js
          node tools/test-personal-sync-auth-error-semantics.js
          node tools/test-school-cache-fallback.js
          node tools/test-school-index-cache-fallback.js
          node tools/test-school-filter-cache-downgrade.js
          node tools/test-school-version-isolation.js
          node tools/test-school-active-snapshot.js
          node tools/test-school-stable-release-pack.js
          node tools/test-school-static-search.js
          node tools/test-school-request-race.js
          node tools/test-request-error-normalize.js
          node tools/test-request-dedupe.js
          node tools/test-background-error-classification.js
