name: Publish API container (GHCR)

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/container-publish.yml"
      - ".dockerignore"
  workflow_dispatch:
    inputs:
      also_amd64:
        description: "Also build linux/amd64 (slow/QEMU)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: katelya77/fosuclass-api

jobs:
  publish-arm64:
    # Prefer native ARM runners; fall back handled by GitHub if unavailable.
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/arm64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_REVISION=${{ github.sha }}
            BUILD_CREATED=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            IMAGE_VERSION=sha-${{ github.sha }}
          cache-from: type=gha,scope=fosu-api-arm64
          cache-to: type=gha,mode=max,scope=fosu-api-arm64
          provenance: true
          sbom: true

      - name: Write digest artifact
        run: |
          echo "digest=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "${{ steps.push.outputs.digest }}" > image-digest.txt
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" > image-ref.txt
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}" > image-inspect.txt || true
          ls -la image-*.txt

      - name: Upload image metadata
        uses: actions/upload-artifact@v4
        with:
          name: ghcr-image-arm64
          path: |
            image-digest.txt
            image-ref.txt
            image-inspect.txt

  publish-amd64:
    if: github.event_name == 'workflow_dispatch' && inputs.also_amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-amd64
          provenance: true
          sbom: true
