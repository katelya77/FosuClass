name: Publish agent platform image (GHCR, multi-arch)

# fosu-agent-platform standalone 镜像双架构发布链：
# ubuntu-latest(amd64) + ubuntu-24.04-arm(arm64) 各自原生 build → 真实 compose smoke
# → push sha-<sha>-<arch> → manifest 合并 sha-<sha>。
# 纪律：禁 floating latest；生产部署依据 = sha-<sha> tag / digest；smoke 不过不 push。

on:
  push:
    branches: [codex/xiaofu-agent-product-platform, main]
    paths:
      - "server/**"
      - "deploy/standalone/**"
      - "apps/**"
      - "packages/**"
      - "tools/standalone-compose-smoke.js"
      - ".github/workflows/agent-platform-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: katelya77/fosu-agent-platform

jobs:
  build-smoke-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ARCH: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          target: standalone
          platforms: linux/amd64
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-smoke-amd64
          build-args: |
            GIT_REVISION=${{ github.sha }}
            BUILD_CREATED=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            IMAGE_VERSION=sha-${{ github.sha }}
          cache-from: type=gha,scope=agent-platform-amd64
          cache-to: type=gha,mode=max,scope=agent-platform-amd64

      - name: Standalone compose smoke (amd64)
        run: >-
          SMOKE_SKIP_BUILD=1
          SMOKE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-smoke-amd64
          SMOKE_PROJECT=agent-ci-smoke-amd64
          node tools/standalone-compose-smoke.js

      - name: Upload smoke transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-smoke-transcript-amd64
          path: .tmp/standalone-compose-smoke-transcript.log
          if-no-files-found: warn

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          target: standalone
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-amd64
          build-args: |
            GIT_REVISION=${{ github.sha }}
            BUILD_CREATED=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            IMAGE_VERSION=sha-${{ github.sha }}
          cache-from: type=gha,scope=agent-platform-amd64
          provenance: true
          sbom: true

      - name: Write digest artifact
        run: |
          echo "${{ steps.push.outputs.digest }}" > image-digest.txt
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" > image-ref.txt
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-amd64" > image-inspect.txt || true
          ls -la image-*.txt

      - name: Upload image metadata
        uses: actions/upload-artifact@v4
        with:
          name: agent-platform-image-amd64
          path: |
            image-digest.txt
            image-ref.txt
            image-inspect.txt

  build-smoke-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      ARCH: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          target: standalone
          platforms: linux/arm64
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-smoke-arm64
          build-args: |
            GIT_REVISION=${{ github.sha }}
            BUILD_CREATED=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            IMAGE_VERSION=sha-${{ github.sha }}
          cache-from: type=gha,scope=agent-platform-arm64
          cache-to: type=gha,mode=max,scope=agent-platform-arm64

      - name: Standalone compose smoke (arm64)
        run: >-
          SMOKE_SKIP_BUILD=1
          SMOKE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-smoke-arm64
          SMOKE_PROJECT=agent-ci-smoke-arm64
          node tools/standalone-compose-smoke.js

      - name: Upload smoke transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-smoke-transcript-arm64
          path: .tmp/standalone-compose-smoke-transcript.log
          if-no-files-found: warn

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/arm64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          target: standalone
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-arm64
          build-args: |
            GIT_REVISION=${{ github.sha }}
            BUILD_CREATED=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            IMAGE_VERSION=sha-${{ github.sha }}
          cache-from: type=gha,scope=agent-platform-arm64
          provenance: true
          sbom: true

      - name: Write digest artifact
        run: |
          echo "${{ steps.push.outputs.digest }}" > image-digest.txt
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" > image-ref.txt
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-arm64" > image-inspect.txt || true
          ls -la image-*.txt

      - name: Upload image metadata
        uses: actions/upload-artifact@v4
        with:
          name: agent-platform-image-arm64
          path: |
            image-digest.txt
            image-ref.txt
            image-inspect.txt

  manifest:
    needs: [build-smoke-amd64, build-smoke-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-arch manifest (sha-${{ github.sha }})
        run: |
          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-amd64" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-arm64"
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}" | tee manifest-inspect.txt

      - name: Upload manifest metadata
        uses: actions/upload-artifact@v4
        with:
          name: agent-platform-manifest
          path: manifest-inspect.txt
