name: Collector Oracle Read-only Diagnostics
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Read-only Oracle path, TLS and sanitized log summaries
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_path: deploy/wyz/diagnose-oracle-transport.sh
          command_timeout: 5m
