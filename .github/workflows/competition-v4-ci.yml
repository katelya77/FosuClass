name: Competition V4 CI

on:
  push:
    branches:
      - feat/campusflow-adp-integration-v4-execution
    paths:
      - "competition/adp-kit/**"
      - "competition/submission-package/**"
      - ".github/workflows/competition-v4-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  campus-tools-v4:
    if: ${{ !contains(github.event.head_commit.message, '[v4-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install CampusTools dev dependencies
        run: npm --prefix competition/adp-kit/mcp/campus-tools-mcp install --ignore-scripts

      - name: CampusTools check
        run: npm --prefix competition/adp-kit/mcp/campus-tools-mcp run check

      - name: CampusTools tests
        run: npm --prefix competition/adp-kit/mcp/campus-tools-mcp test

      - name: Review V4 conflict outputs
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { callTool } = require('./competition/adp-kit/mcp/campus-tools-mcp/src/tools');
          const cases = [
            ['teacher-pair-week1', {
              firstType: 'teacher', firstName: '教师001',
              secondType: 'teacher', secondName: '教师002', week: 1,
            }],
            ['teacher-self-week1-mon', {
              firstType: 'teacher', firstName: '教师003',
              secondType: 'teacher', secondName: '教师003', week: 1, weekday: 1,
            }],
            ['course-math-english-week1', {
              firstType: 'course', firstName: '高等数学A',
              secondType: 'course', secondName: '大学英语A', week: 1,
            }],
            ['room-a1-101-a1-102-week1', {
              firstType: 'room', firstName: 'A1-101',
              secondType: 'room', secondName: 'A1-102', week: 1,
            }],
          ];
          for (const [id, input] of cases) {
            const env = callTool('compare_schedules', input);
            assert.equal(env.success, true, `${id}: success`);
            assert.equal(env.dataVersion, 'competition-demo-v1', `${id}: dataVersion`);
            assert.equal(env.evidence && env.evidence.verified, true, `${id}: verified`);
            assert.equal(env.evidence && env.evidence.dataHash, 'sha1:fefef4bf425b', `${id}: dataHash`);
            assert.equal(env.query.week, 1, `${id}: week`);
          }
          const self = callTool('compare_schedules', cases[1][1]);
          assert.equal(self.summary.selfCompare, true);
          assert.equal(self.items.some((item) => item.first.lessonId === item.second.lessonId), false);
          const rushKeys = self.rushWarnings.map((item) =>
            `${item.entity}|${item.weekday}|${item.from.lessonId}|${item.to.lessonId}`,
          );
          assert.equal(new Set(rushKeys).size, rushKeys.length);
          assert.equal(self.summary.rushWarningCount, self.rushWarnings.length);
          const sentinel = callTool('compare_schedules', {
            firstType: 'room', firstName: 'A1-101', secondType: 'room', secondName: 'A1-102',
            week: 1, weekday: 0,
          });
          assert.equal(sentinel.success, true);
          assert.equal(sentinel.query.weekday, null);
          console.log('[pass] V4 conflict review assertions passed');
          NODE

      - name: Accept reviewed Golden
        run: node competition/adp-kit/evaluation/generate-golden-results.js --accept-reviewed

      - name: Regenerate ADP kit artifacts
        run: npm --prefix competition/adp-kit run generate

      - name: Full competition ADP kit gate
        run: npm test --prefix competition/adp-kit

      - name: Diff check
        run: git diff --check

      - name: Commit reviewed generated artifacts
        shell: bash
        run: |
          git status --short
          git config user.name "Katelya"
          git config user.email "123220557+katelya77@users.noreply.github.com"
          git add -u competition/adp-kit competition/submission-package
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "test: refresh conflict v4 golden artifacts [v4-generated]"
            git push origin HEAD:feat/campusflow-adp-integration-v4-execution
          fi
