name: Public Security Gate

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  public-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full reachable history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tracked, workflow, snapshot and history guards
        run: python tools/public-ready-scan.py --no-ignored --report output/security/ci-public-security.json

      - name: Run Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/zricethezav/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            range="${{ github.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          /tmp/gitleaks detect --redact --exit-code=2 --config .gitleaks.toml --log-opts="--no-merges --first-parent ${range}"
