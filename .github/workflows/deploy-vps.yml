name: Verify, publish and deploy API digest

on:
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "admin-web/**"
      - "config/admin-rollout-manifest.json"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - ".github/workflows/deploy-vps.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "admin-web/**"
      - "config/admin-rollout-manifest.json"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Build the branch digest and run read-only production preflight without deploying
        required: true
        type: boolean
        default: false

concurrency:
  group: fosuclass-api-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: katelya77/fosuclass-api

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image_target: ${{ steps.rollout.outputs.image_target }}
      rollout_version: ${{ steps.rollout.outputs.rollout_version }}
      write_modules: ${{ steps.rollout.outputs.write_modules }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            admin-web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix admin-web ci

      - name: Resolve versioned rollout manifest
        id: rollout
        run: node tools/resolve-deploy-rollout.js --github-output

      - name: Generate miniprogram build metadata
        run: npm run build:miniprogram-info

      - name: Release and architecture preflight
        run: |
          npm run release:preflight
          npm run admin:feature-matrix:check
          npm run test:architecture-guards

      - name: Runtime data and production compose contracts
        run: |
          npm run test:runtime-data-bootstrap
          npm run test:runtime-data-migration
          npm run test:runtime-data-paths
          npm run test:runtime-compose-contract
          npm run test:runtime-persistence-verifier
          npm run test:runtime-data-recreate-helpers
          npm run test:startup-data-reconciliation-guard
          npm run test:deploy-rollout-resolver
          npm run test:ghcr-digest-deploy-contract

      - name: Server and security acceptance
        run: |
          npm run test:server-ai-module-require
          npm run test:server-no-root-shared-require
          npm run test:server-docker-smoke
          npm run security:acceptance

      - name: Admin unit and production build
        run: |
          npm run admin:test
          npm run admin:build
          node tools/test-admin-spa-bundle-present.js

  runtime-data-recreate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci

      - name: Prove mounted runtime state survives a real recreate
        run: npm run test:runtime-data-recreate

  build-arm64:
    if: github.event_name != 'pull_request'
    needs: [verify, runtime-data-recreate]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      core_digest: ${{ steps.core.outputs.digest }}
      browser_digest: ${{ steps.browser.outputs.digest }}
      image_digest: ${{ steps.select.outputs.image_digest }}
      image_ref: ${{ steps.select.outputs.image_ref }}
      image_target: ${{ steps.select.outputs.image_target }}
    steps:
      - name: Checkout verified source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Resolve stable source metadata
        id: source
        shell: bash
        run: |
          set -euo pipefail
          build_created="$(git show -s --format=%cI "$GITHUB_SHA")"
          if [ -z "$build_created" ]; then
            echo "::error::Commit timestamp is unavailable"
            exit 1
          fi
          echo "build_created=$build_created" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Generate the same build metadata used by verification
        run: |
          npm ci
          npm run build:miniprogram-info

      - name: Login for image publication
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push core ARM64 image
        id: core
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          target: core
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-core
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            GIT_REVISION=${{ github.sha }}
            BUILD_CREATED=${{ steps.source.outputs.build_created }}
            IMAGE_VERSION=sha-${{ github.sha }}-core
          cache-from: type=gha,scope=fosu-api-core-arm64
          cache-to: type=gha,mode=max,scope=fosu-api-core-arm64
          provenance: true
          sbom: true

      - name: Build and push browser ARM64 image
        id: browser
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          target: browser
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-browser
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            GIT_REVISION=${{ github.sha }}
            BUILD_CREATED=${{ steps.source.outputs.build_created }}
            IMAGE_VERSION=sha-${{ github.sha }}-browser
          cache-from: type=gha,scope=fosu-api-browser-arm64
          cache-to: type=gha,mode=max,scope=fosu-api-browser-arm64
          provenance: true
          sbom: true

      - name: Select exact digest from rollout manifest
        id: select
        shell: bash
        env:
          IMAGE_TARGET: ${{ needs.verify.outputs.image_target }}
          CORE_DIGEST: ${{ steps.core.outputs.digest }}
          BROWSER_DIGEST: ${{ steps.browser.outputs.digest }}
        run: |
          set -euo pipefail
          case "$IMAGE_TARGET" in
            core) digest="$CORE_DIGEST" ;;
            browser) digest="$BROWSER_DIGEST" ;;
            *) echo "::error::Unsupported rollout image target: $IMAGE_TARGET"; exit 1 ;;
          esac
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build did not return an immutable digest"
            exit 1
          fi
          image_ref="${REGISTRY}/${IMAGE_NAME}@${digest}"
          echo "image_target=$IMAGE_TARGET" >> "$GITHUB_OUTPUT"
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          printf 'target=%s\ncore=%s\nbrowser=%s\nselected=%s\n' "$IMAGE_TARGET" "$CORE_DIGEST" "$BROWSER_DIGEST" "$image_ref" > image-digests.txt
          docker buildx imagetools inspect "$image_ref" > selected-image-inspect.txt

      - name: Capture registry compression evidence
        shell: bash
        env:
          CORE_DIGEST: ${{ steps.core.outputs.digest }}
          BROWSER_DIGEST: ${{ steps.browser.outputs.digest }}
        run: |
          set -euo pipefail
          collect_registry_evidence() {
            local target="$1"
            local digest="$2"
            local image_ref="${REGISTRY}/${IMAGE_NAME}@${digest}"
            local top_file="${target}-top-manifest.json"
            local platform_file="${target}-platform-manifest.json"
            docker buildx imagetools inspect --raw "$image_ref" > "$top_file"
            local platform_digest
            platform_digest="$(node -e '
              const fs=require("fs");
              const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              const item=Array.isArray(value.manifests)
                ? value.manifests.find((entry)=>entry.platform&&entry.platform.os==="linux"&&entry.platform.architecture==="arm64")
                : null;
              process.stdout.write(item&&item.digest||"");
            ' "$top_file")"
            if [ -n "$platform_digest" ]; then
              docker buildx imagetools inspect --raw "${REGISTRY}/${IMAGE_NAME}@${platform_digest}" > "$platform_file"
            else
              cp "$top_file" "$platform_file"
              platform_digest="$digest"
            fi
            EVIDENCE_TARGET="$target" \
            EVIDENCE_TOP_DIGEST="$digest" \
            EVIDENCE_PLATFORM_DIGEST="$platform_digest" \
            EVIDENCE_TOP_FILE="$top_file" \
            EVIDENCE_PLATFORM_FILE="$platform_file" \
            node <<'NODE' > "${target}-registry-evidence.json"
          const fs = require("fs");
          const top = JSON.parse(fs.readFileSync(process.env.EVIDENCE_TOP_FILE, "utf8"));
          const manifest = JSON.parse(fs.readFileSync(process.env.EVIDENCE_PLATFORM_FILE, "utf8"));
          const layers = Array.isArray(manifest.layers) ? manifest.layers : [];
          const evidence = {
            schemaVersion: 1,
            target: process.env.EVIDENCE_TARGET,
            architecture: "linux/arm64",
            topLevelDigest: process.env.EVIDENCE_TOP_DIGEST,
            topLevelMediaType: top.mediaType || null,
            platformManifestDigest: process.env.EVIDENCE_PLATFORM_DIGEST,
            platformManifestMediaType: manifest.mediaType || null,
            configDescriptor: manifest.config || null,
            configBytes: Number(manifest.config && manifest.config.size || 0),
            layers,
            compressedLayerBytes: layers.reduce((total, layer) => total + Number(layer.size || 0), 0),
          };
          process.stdout.write(`${JSON.stringify(evidence, null, 2)}\n`);
          NODE
          }
          collect_registry_evidence core "$CORE_DIGEST"
          collect_registry_evidence browser "$BROWSER_DIGEST"

      - name: Upload immutable image evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghcr-arm64-digests-${{ github.sha }}
          path: |
            image-digests.txt
            selected-image-inspect.txt
            core-top-manifest.json
            core-platform-manifest.json
            core-registry-evidence.json
            browser-top-manifest.json
            browser-platform-manifest.json
            browser-registry-evidence.json

  production-preflight:
    # Never execute pull-request-controlled code with production SSH material.
    # A protected pre-merge preflight is run by workflow_dispatch on the PR SHA.
    if: always() && github.event_name != 'pull_request' && needs.verify.result == 'success'
    needs: [verify, build-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout read-only preflight
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Fingerprint candidate Compose
        id: candidate_compose
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sha256sum server/docker-compose.yml | awk '{print $1}')"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Classify production secret availability
        id: production_secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          missing=()
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_APP_DIR; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '{"schemaVersion":1,"status":"UNKNOWN","reason":"production-secrets-unavailable","missingSecretNames":[' > production-preflight.json
            separator=""
            for name in "${missing[@]}"; do
              printf '%s"%s"' "$separator" "$name" >> production-preflight.json
              separator=,
            done
            printf '],"manualRemediation":"dispatch this branch with preflight_only=true where the production environment is authorized"}\n' >> production-preflight.json
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare isolated candidate preflight directory
        id: host_preflight
        if: steps.production_secrets.outputs.available == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: VPS_APP_DIR
          script: |
            set -euo pipefail
            mkdir -p "$VPS_APP_DIR/.deploy-preflight/${{ github.sha }}"
            chmod 700 "$VPS_APP_DIR/.deploy-preflight" "$VPS_APP_DIR/.deploy-preflight/${{ github.sha }}"

      - name: Stage candidate Compose for remote validation
        if: steps.production_secrets.outputs.available == 'true' && steps.host_preflight.outcome == 'success'
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "server/docker-compose.yml"
          target: "${{ secrets.VPS_APP_DIR }}/.deploy-preflight/${{ github.sha }}"
          overwrite: true

      - name: Inspect production host and candidate without service mutation
        id: candidate_preflight
        if: steps.production_secrets.outputs.available == 'true' && steps.host_preflight.outcome == 'success'
        continue-on-error: true
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          GHCR_READ_USERNAME: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ github.token }}
          FOSU_PREFLIGHT_IMAGE: ${{ needs.build-arm64.outputs.image_ref }}
          FOSU_ROLLOUT_VERSION: ${{ needs.verify.outputs.rollout_version }}
          FOSU_ADMIN_WRITE_MODULES: ${{ needs.verify.outputs.write_modules }}
          FOSU_DEPLOY_COMMIT_SHA: ${{ github.sha }}
          FOSU_PREFLIGHT_COMPOSE_FILE: ${{ secrets.VPS_APP_DIR }}/.deploy-preflight/${{ github.sha }}/server/docker-compose.yml
          FOSU_PREFLIGHT_COMPOSE_SHA256: ${{ steps.candidate_compose.outputs.sha256 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: VPS_APP_DIR,GHCR_READ_USERNAME,GHCR_READ_TOKEN,FOSU_PREFLIGHT_IMAGE,FOSU_ROLLOUT_VERSION,FOSU_ADMIN_WRITE_MODULES,FOSU_DEPLOY_COMMIT_SHA,FOSU_PREFLIGHT_COMPOSE_FILE,FOSU_PREFLIGHT_COMPOSE_SHA256
          script_path: server/scripts/preflight-ghcr-digest-deploy.sh
          capture_stdout: true

      - name: Materialize production preflight evidence
        if: always() && steps.production_secrets.outputs.available == 'true'
        shell: bash
        env:
          REMOTE_STDOUT: ${{ steps.candidate_preflight.outputs.stdout }}
          REMOTE_OUTCOME: ${{ steps.candidate_preflight.outcome }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const lines = String(process.env.REMOTE_STDOUT || "").split(/\r?\n/).filter(Boolean);
          let evidence = null;
          for (let index = lines.length - 1; index >= 0; index -= 1) {
            try {
              const value = JSON.parse(lines[index]);
              if (value && value.schemaVersion === 1 && ["SUCCESS", "UNKNOWN"].includes(value.status)) {
                evidence = value;
                break;
              }
            } catch (_) {}
          }
          if (!evidence) evidence = {
            schemaVersion: 1,
            status: "UNKNOWN",
            reason: "remote-preflight-produced-no-parseable-evidence",
          };
          evidence.actionOutcome = process.env.REMOTE_OUTCOME || "unknown";
          fs.writeFileSync("production-preflight.json", `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Upload production preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-preflight-${{ github.sha }}
          path: production-preflight.json

      - name: Enforce known-good production preflight
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("production-preflight.json")) throw new Error("production preflight evidence is missing");
            const value = JSON.parse(fs.readFileSync("production-preflight.json", "utf8"));
            if (value.status !== "SUCCESS" || (value.actionOutcome && value.actionOutcome !== "success")) {
              throw new Error(`production preflight is ${value.status || "UNKNOWN"}: ${value.reason || "unknown reason"}`);
            }
          '

  deploy-production:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      !(github.event_name == 'workflow_dispatch' && inputs.preflight_only) &&
      needs.verify.result == 'success' &&
      needs.build-arm64.result == 'success' &&
      needs.production-preflight.result == 'success'
    needs: [verify, build-arm64, production-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate SSH deployment secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_APP_DIR; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required production secret: $name"
              exit 1
            fi
          done

      - name: Package immutable deployment control files
        id: control_bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="$(mktemp -d "$RUNNER_TEMP/fosu-deploy-control.XXXXXXXX")"
          archive_name="deploy-control-${GITHUB_SHA}.tar.gz"
          mkdir -p "$bundle_root/server/scripts"
          cp server/docker-compose.yml "$bundle_root/server/docker-compose.yml"
          cp server/scripts/deploy-ghcr-digest.sh "$bundle_root/server/scripts/deploy-ghcr-digest.sh"
          cp server/scripts/migrate-runtime-data.js "$bundle_root/server/scripts/migrate-runtime-data.js"
          cp server/scripts/verify-runtime-persistence.js "$bundle_root/server/scripts/verify-runtime-persistence.js"
          (
            cd "$bundle_root"
            sha256sum \
              server/docker-compose.yml \
              server/scripts/deploy-ghcr-digest.sh \
              server/scripts/migrate-runtime-data.js \
              server/scripts/verify-runtime-persistence.js > control-files.sha256
          )
          tar -czf "$GITHUB_WORKSPACE/$archive_name" -C "$bundle_root" .
          archive_sha256="$(sha256sum "$GITHUB_WORKSPACE/$archive_name" | awk '{print $1}')"
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload immutable deployment control archive
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "${{ steps.control_bundle.outputs.archive_name }}"
          target: "${{ secrets.VPS_APP_DIR }}/.deploy-incoming"
          overwrite: true

      - name: Pull exact digest, deploy, smoke and rollback on failure
        id: deploy_exact_digest
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          GHCR_READ_USERNAME: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ github.token }}
          FOSU_API_IMAGE: ${{ needs.build-arm64.outputs.image_ref }}
          FOSU_IMAGE_TARGET: ${{ needs.build-arm64.outputs.image_target }}
          FOSU_ROLLOUT_VERSION: ${{ needs.verify.outputs.rollout_version }}
          FOSU_ADMIN_WRITE_MODULES: ${{ needs.verify.outputs.write_modules }}
          FOSU_DEPLOY_COMMIT_SHA: ${{ github.sha }}
          CONTROL_ARCHIVE_SHA256: ${{ steps.control_bundle.outputs.archive_sha256 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: GHCR_READ_USERNAME,GHCR_READ_TOKEN,FOSU_API_IMAGE,FOSU_IMAGE_TARGET,FOSU_ROLLOUT_VERSION,FOSU_ADMIN_WRITE_MODULES,FOSU_DEPLOY_COMMIT_SHA,CONTROL_ARCHIVE_SHA256,VPS_APP_DIR
          capture_stdout: true
          script: |
            set -euo pipefail
            for command_name in node tar sha256sum diff; do command -v "$command_name" >/dev/null; done
            [[ "$FOSU_DEPLOY_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$CONTROL_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            incoming="$VPS_APP_DIR/.deploy-incoming/deploy-control-${FOSU_DEPLOY_COMMIT_SHA}.tar.gz"
            control_parent="$VPS_APP_DIR/.deploy-control"
            control_dir="$control_parent/$FOSU_DEPLOY_COMMIT_SHA"
            test -f "$incoming"
            test "$(sha256sum "$incoming" | awk '{print $1}')" = "$CONTROL_ARCHIVE_SHA256"
            mkdir -p "$control_parent"
            chmod 700 "$control_parent"

            validate_control_dir() {
              local candidate="$1"
              CONTROL_STAGE="$candidate" node <<'NODE'
            const fs = require("fs");
            const path = require("path");
            const root = fs.realpathSync(process.env.CONTROL_STAGE);
            const expected = new Set([
              ".archive-sha256",
              "control-files.sha256",
              "server/docker-compose.yml",
              "server/scripts/deploy-ghcr-digest.sh",
              "server/scripts/migrate-runtime-data.js",
              "server/scripts/verify-runtime-persistence.js",
            ]);
            const actual = [];
            function visit(directory) {
              for (const name of fs.readdirSync(directory).sort()) {
                const absolute = path.join(directory, name);
                const stat = fs.lstatSync(absolute);
                if (stat.isSymbolicLink()) throw new Error("deployment control archive contains a symlink");
                if (stat.isDirectory()) visit(absolute);
                else if (stat.isFile()) actual.push(path.relative(root, absolute).replace(/\\/g, "/"));
                else throw new Error("deployment control archive contains a special file");
              }
            }
            visit(root);
            if (actual.length !== expected.size || actual.some((name) => !expected.has(name))) {
              throw new Error("deployment control archive file set is invalid");
            }
            const archiveDigest = fs.readFileSync(path.join(root, ".archive-sha256"), "utf8").trim();
            if (archiveDigest !== process.env.CONTROL_ARCHIVE_SHA256) throw new Error("deployment control directory is not bound to the uploaded archive");
            NODE
              (cd "$candidate" && sha256sum -c control-files.sha256)
            }

            control_stage="$(mktemp -d "$control_parent/.stage-${FOSU_DEPLOY_COMMIT_SHA}.XXXXXXXX")"
            cleanup_control_stage() {
              if [ -n "${control_stage:-}" ] && [ -d "$control_stage" ]; then
                case "$control_stage" in "$control_parent"/.stage-*) rm -rf -- "$control_stage" ;; esac
              fi
            }
            trap cleanup_control_stage EXIT
            tar -xzf "$incoming" --no-same-owner --no-same-permissions -C "$control_stage"
            printf '%s\n' "$CONTROL_ARCHIVE_SHA256" > "$control_stage/.archive-sha256"
            validate_control_dir "$control_stage"
            chmod 700 "$control_stage" "$control_stage/server" "$control_stage/server/scripts"
            chmod 600 "$control_stage/.archive-sha256" "$control_stage/control-files.sha256" "$control_stage/server/docker-compose.yml" "$control_stage/server/scripts/"*
            if [ ! -d "$control_dir" ]; then
              mv "$control_stage" "$control_dir"
              control_stage=""
            else
              validate_control_dir "$control_dir"
              diff -qr -- "$control_stage" "$control_dir"
              cleanup_control_stage
              control_stage=""
            fi
            trap - EXIT
            rm -f -- "$incoming"
            export FOSU_DEPLOY_CONTROL_DIR="$control_dir/server"
            chmod 700 "$FOSU_DEPLOY_CONTROL_DIR/scripts/deploy-ghcr-digest.sh"
            cd "$VPS_APP_DIR/server"
            bash "$FOSU_DEPLOY_CONTROL_DIR/scripts/deploy-ghcr-digest.sh"

      - name: Materialize deployment and rollback evidence
        if: always()
        shell: bash
        env:
          DEPLOY_STDOUT: ${{ steps.deploy_exact_digest.outputs.stdout }}
          DEPLOY_OUTCOME: ${{ steps.deploy_exact_digest.outcome }}
          EXPECTED_IMAGE: ${{ needs.build-arm64.outputs.image_ref }}
          EXPECTED_TARGET: ${{ needs.build-arm64.outputs.image_target }}
          EXPECTED_ROLLOUT: ${{ needs.verify.outputs.rollout_version }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const allowed = new Set([
            "deployment_digest", "rollback_digest", "rollout_version", "image_target",
            "original_container_state", "persistence_snapshot", "persistence_result",
            "admin_primary", "admin_next_enabled", "runtime_migration_gate",
            "runtime_persistence_result", "rollback_persistence_result",
            "image_size_evidence", "old_uncompressed_image_bytes", "candidate_uncompressed_image_bytes",
          ]);
          const values = {};
          for (const line of String(process.env.DEPLOY_STDOUT || "").split(/\r?\n/)) {
            const index = line.indexOf("=");
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            if (allowed.has(key)) values[key] = line.slice(index + 1).trim();
          }
          const actionOutcome = process.env.DEPLOY_OUTCOME || "unknown";
          const exactImage = (value) => /^ghcr\.io\/katelya77\/fosuclass-api@sha256:[0-9a-f]{64}$/.test(String(value || ""));
          const succeeded = actionOutcome === "success"
            && values.deployment_digest === process.env.EXPECTED_IMAGE
            && exactImage(values.rollback_digest)
            && values.image_target === process.env.EXPECTED_TARGET
            && values.rollout_version === process.env.EXPECTED_ROLLOUT
            && values.admin_primary === "legacy"
            && values.admin_next_enabled === "true"
            && Boolean(values.runtime_migration_gate)
            && Boolean(values.persistence_snapshot)
            && Boolean(values.persistence_result)
            && Boolean(values.runtime_persistence_result);
          const evidence = {
            schemaVersion: 1,
            status: succeeded ? "SUCCESS" : actionOutcome === "failure" ? "FAILED" : "UNKNOWN",
            actionOutcome,
            expectedDigest: process.env.EXPECTED_IMAGE || "UNKNOWN",
            deploymentDigest: values.deployment_digest || "UNKNOWN",
            rollbackDigest: values.rollback_digest || "UNKNOWN",
            rollbackObserved: actionOutcome === "failure" && exactImage(values.rollback_digest),
            rolloutVersion: values.rollout_version || process.env.EXPECTED_ROLLOUT || "UNKNOWN",
            imageTarget: values.image_target || process.env.EXPECTED_TARGET || "UNKNOWN",
            originalContainerState: values.original_container_state || "UNKNOWN",
            adminPrimary: values.admin_primary || "UNKNOWN",
            adminNextEnabled: values.admin_next_enabled || "UNKNOWN",
            persistenceSnapshot: values.persistence_snapshot || "UNKNOWN",
            persistenceResult: values.persistence_result || values.runtime_persistence_result || "UNKNOWN",
            rollbackPersistenceResult: values.rollback_persistence_result || "UNKNOWN",
            migrationEvidence: values.runtime_migration_gate || "UNKNOWN",
            imageSizeEvidence: values.image_size_evidence || "UNKNOWN",
            oldUncompressedImageBytes: Number(values.old_uncompressed_image_bytes || 0) || "UNKNOWN",
            candidateUncompressedImageBytes: Number(values.candidate_uncompressed_image_bytes || 0) || "UNKNOWN",
          };
          fs.writeFileSync("deployment-evidence.json", `${JSON.stringify(evidence, null, 2)}\n`);
          if (actionOutcome === "success" && !succeeded) process.exitCode = 1;
          NODE

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-evidence-${{ github.sha }}
          path: deployment-evidence.json

      - name: Deployment evidence
        run: |
          echo "### Production digest deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- rollout: \`${{ needs.verify.outputs.rollout_version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- target: \`${{ needs.build-arm64.outputs.image_target }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- image: \`${{ needs.build-arm64.outputs.image_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- admin primary: \`legacy\`; admin-next enabled: \`true\`" >> "$GITHUB_STEP_SUMMARY"
