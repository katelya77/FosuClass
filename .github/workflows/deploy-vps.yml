name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch: # 支持手动触发部署

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check GitHub Secrets
        run: |
          declare -A secrets_map
          secrets_map=(
            ["VPS_HOST"]="${{ secrets.VPS_HOST }}"
            ["VPS_USER"]="${{ secrets.VPS_USER }}"
            ["VPS_SSH_KEY"]="${{ secrets.VPS_SSH_KEY }}"
            ["VPS_APP_DIR"]="${{ secrets.VPS_APP_DIR }}"
            ["ADMIN_API_TOKEN"]="${{ secrets.ADMIN_API_TOKEN }}"
          )
          
          has_missing=false
          for key in "${!secrets_map[@]}"; do
            if [ -z "${secrets_map[$key]}" ]; then
              echo "::error::缺少 GitHub Secret: $key，请在 Settings → Secrets and variables → Actions 中配置。"
              has_missing=true
            fi
          done
          
          if [ "$has_missing" = true ]; then
            exit 1
          fi

      - name: Predeploy server module checks
        working-directory: server
        run: |
          node -e "require('./src/utils/courseNormalizer'); console.log('courseNormalizer ok')"
          node -e "require('./src/utils/scheduleNormalizer'); console.log('scheduleNormalizer ok')"

      - name: Upload server/ directory via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "server/**,!server/node_modules/**,!server/.env"
          target: "${{ secrets.VPS_APP_DIR }}"

      - name: SSH Remote Deploy & Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # 保证工作目录存在并进入
            cd ${{ secrets.VPS_APP_DIR }}/server
            
            # 创建宿主机持久化 storage 目录并配置权限，不删除也不覆盖
            mkdir -p storage
            chmod 755 storage
            
            # 自动生成 .env 配置文件，直接写入
            cat << 'EOF' > .env
            NODE_ENV=production
            PORT=3000
            HOST_BIND_IP=127.0.0.1
            HOST_API_PORT=18318
            PUBLIC_API_ORIGIN=https://class.katelya.eu.org
            DATA_SOURCE_MODE=cache-first
            ADMIN_API_TOKEN=${{ secrets.ADMIN_API_TOKEN }}
            FOSU_BASE_URL=https://100.fosu.edu.cn
            FOSU_AUTH_URL=https://authserver.fosu.edu.cn
            CACHE_TTL_CATALOG=600
            CACHE_TTL_MAJOR=1800
            CACHE_TTL_SCHEDULE=600
            REQUEST_TIMEOUT_MS=15000
            CORS_ALLOWED_ORIGINS=https://class.katelya.eu.org,http://127.0.0.1:18318
            EOF
            
            # 启动容器。直接使用 sudo，避免无权限时先失败一次造成误导日志。
            sudo docker compose up -d --build
            
            # 最多等待 30 秒，循环检查容器内 API 是否真正启动成功。
            healthy=false
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:18318/api/health; then
                healthy=true
                break
              fi
              echo "Waiting for fosuclass-api health check... ($i/30)"
              sleep 1
            done
            
            if [ "$healthy" != "true" ]; then
              echo "::error::fosuclass-api health check failed after 30 seconds"
              sudo docker ps -a
              sudo docker logs fosuclass-api --tail=200 || true
              exit 1
            fi
            
            sudo docker ps --filter "name=fosuclass-api"

      - name: Show Deployment Info
        run: |
          echo "=================================================="
          echo "🎉 部署完成 / Deployment Completed!"
          echo "=================================================="
          echo "- 容器名：fosuclass-api"
          echo "- 本机健康检查：http://127.0.0.1:18318/api/health"
          echo "- 1Panel 反代目标：http://127.0.0.1:18318"
          echo "- 小程序 API 域名：https://class.katelya.eu.org"
          echo "=================================================="
