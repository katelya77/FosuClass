name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      configure_coze_workload:
        description: Configure trial/dev to use the deployed Coze project API and verify it
        required: false
        type: boolean
        default: false
      configure_cloudbase_openai:
        description: Write CloudBase Hunyuan (cloudbase-openai) credentials into trial/dev profiles and probe
        required: false
        type: boolean
        default: false
      diagnose_providers:
        description: Run sanitized provider diagnostics (resolved config + raw deepseek probe)
        required: false
        type: boolean
        default: false
      configure_deepseek:
        description: Refresh deepseek API key and pin understanding/planner stages to deepseek
        required: false
        type: boolean
        default: false
      verify_custom_openai:
        description: E2E-verify a custom OpenAI-compatible provider (register DeepSeek endpoint, fetch models, chat, probe, restore)
        required: false
        type: boolean
        default: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Release preflight
        run: npm run release:preflight

      - name: Xiaofu Agent release gate
        run: npm run test:agent-release-gate

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check GitHub Secrets
        shell: bash
        run: |
          set -euo pipefail
          declare -A required_secrets=(
            ["VPS_HOST"]="${{ secrets.VPS_HOST }}"
            ["VPS_USER"]="${{ secrets.VPS_USER }}"
            ["VPS_SSH_KEY"]="${{ secrets.VPS_SSH_KEY }}"
            ["VPS_APP_DIR"]="${{ secrets.VPS_APP_DIR }}"
            ["ADMIN_API_TOKEN"]="${{ secrets.ADMIN_API_TOKEN }}"
            ["ADMIN_PASSWORD"]="${{ secrets.ADMIN_PASSWORD }}"
            ["FOSU_AI_CONFIG_ENCRYPTION_KEY"]="${{ secrets.FOSU_AI_CONFIG_ENCRYPTION_KEY }}"
            ["FOSU_AGENT_MEMORY_SECRET"]="${{ secrets.FOSU_AGENT_MEMORY_SECRET }}"
            ["FOSU_AGENT_REMINDER_SECRET"]="${{ secrets.FOSU_AGENT_REMINDER_SECRET }}"
            ["FOSU_WECHAT_RECIPIENT_SECRET"]="${{ secrets.FOSU_WECHAT_RECIPIENT_SECRET }}"
          )

          has_missing_required=false
          for key in "${!required_secrets[@]}"; do
            if [ -z "${required_secrets[$key]}" ]; then
              echo "::error::Missing GitHub Actions Secret: ${key}"
              has_missing_required=true
            fi
          done

          if [ -z "${{ secrets.ADMIN_TOKEN }}" ]; then
            echo "::warning::ADMIN_TOKEN is not configured. Admin login will rely on ADMIN_PASSWORD."
          fi
          security_mode="${{ vars.FOSU_SECURITY_MODE || 'observe' }}"
          if [ "$security_mode" != "observe" ]; then
            if [ -z "${{ secrets.WECHAT_APPID }}" ] || [ -z "${{ secrets.WECHAT_APPSECRET }}" ]; then
              echo "::error::WECHAT_APPID and WECHAT_APPSECRET are required for session/ticket security modes."
              has_missing_required=true
            fi
            if [ -z "${{ secrets.FOSU_SESSION_SECRET_CURRENT }}" ]; then
              echo "::error::FOSU_SESSION_SECRET_CURRENT is required for session/ticket security modes."
              has_missing_required=true
            fi
          fi
          if { [ "$security_mode" = "ticket" ] || [ "$security_mode" = "ticket-enforce" ]; } && [ -z "${{ secrets.FOSU_STATIC_TICKET_SECRET_CURRENT }}" ]; then
            echo "::error::FOSU_STATIC_TICKET_SECRET_CURRENT is required for ticket security mode."
            has_missing_required=true
          fi

          if [ "$has_missing_required" = true ]; then
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Generate miniprogram build metadata
        id: build_info
        run: npm run build:miniprogram-info

      - name: Predeploy server module checks
        working-directory: server
        run: |
          node --check src/services/staticReleaseSyncService.js
          node --check src/services/securityModeService.js
          node --check src/services/rateLimitService.js
          node --check src/services/securityEventService.js
          node --check src/services/clientCheckService.js
          node --check src/security/routeSecurityPolicy.js
          node --check src/workers/releaseWorker.js
          node --check scripts/security-postdeploy-check.js
          node --check scripts/reconcile-static-release.js
          node --check scripts/configure-coze-workload.js
          node -e "require('./src/utils/courseNormalizer'); console.log('courseNormalizer ok')"
          node -e "require('./src/utils/scheduleNormalizer'); console.log('scheduleNormalizer ok')"

      - name: AI deploy smoke checks
        run: |
          npm run test:server-ai-module-require
          npm run test:server-no-root-shared-require
          npm run test:server-docker-smoke

      - name: Security acceptance tests
        run: npm run security:acceptance

      - name: Upload server/ directory via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "server/**,!server/node_modules/**,!server/.env,!server/storage/**,.dockerignore"
          target: "${{ secrets.VPS_APP_DIR }}"

      - name: SSH Remote Deploy & Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -Eeuo pipefail

            APP_DIR='${{ secrets.VPS_APP_DIR }}'
            COMMIT_SHA='${{ github.sha }}'
            CONTAINER_NAME='fosuclass-api'
            PUBLIC_BASE_URL='https://class.katelya.eu.org/static/releases'
            OPENRESTY_HOST_RELEASE_DIR='/opt/1panel/www/sites/class.katelya.eu.org/index/static/releases'
            OPENRESTY_HOST_RUNTIME_DIR='/opt/1panel/www/sites/class.katelya.eu.org/index/static/runtime'
            STARTED_AT="$(date +%s)"

            GUARD="$APP_DIR/server/scripts/deploy-guard.sh"
            trap 'bash "$GUARD" diagnose "$CONTAINER_NAME" || true' ERR

            cd "$APP_DIR/server"

            mkdir -p "$APP_DIR/server/storage"
            chmod 755 "$APP_DIR/server/storage"
            sudo mkdir -p "$OPENRESTY_HOST_RELEASE_DIR"
            sudo mkdir -p "$OPENRESTY_HOST_RUNTIME_DIR"
            sudo chmod 755 "$OPENRESTY_HOST_RELEASE_DIR"
            sudo chmod 755 "$OPENRESTY_HOST_RUNTIME_DIR"

            # Pre-deploy backup + state record; failure aborts before any mutation.
            bash scripts/deploy-guard.sh pre "$APP_DIR" "$CONTAINER_NAME" "$COMMIT_SHA"

            restart_before="$(sudo docker inspect -f '{{.RestartCount}}' "$CONTAINER_NAME" 2>/dev/null || echo 0)"

            umask 077
            tmp_env=".env.$$.$(date +%s).tmp"
            existing_env=".env"
            runtime_ai_config="storage/secure/ai-provider-config.json"
            read_existing_env_value() {
              local key="$1"
              if [ -f "$existing_env" ]; then
                grep -E "^${key}=" "$existing_env" | tail -n 1 | cut -d= -f2- || true
              fi
            }
            read_runtime_env_value() {
              local key="$1"
              if [ -f "$runtime_ai_config" ]; then
                node -e 'const fs=require("fs");const key=process.argv[1];const file=process.argv[2];try{const data=JSON.parse(fs.readFileSync(file,"utf8"));const value=data&&Object.prototype.hasOwnProperty.call(data,key)?data[key]:"";process.stdout.write(value==null?"":String(value));}catch(error){}' "$key" "$runtime_ai_config" || true
              fi
            }
            append_ai_env() {
              local key="$1"
              local incoming="$2"
              local default_value="${3:-}"
              local value=""
              if [ -n "$incoming" ]; then
                value="$incoming"
              else
                value="$(read_runtime_env_value "$key")"
                if [ -z "$value" ]; then
                  value="$(read_existing_env_value "$key")"
                fi
                if [ -z "$value" ]; then
                  value="$default_value"
                fi
              fi
              printf '%s=%s\n' "$key" "$value" >> "$tmp_env"
            }
            cat > "$tmp_env" <<EOF
            NODE_ENV=production
            PORT=3000
            HOST_BIND_IP=127.0.0.1
            HOST_API_PORT=18318
            PUBLIC_API_ORIGIN=https://class.katelya.eu.org
            FOSU_API_BASE_URL=https://class.katelya.eu.org
            FOSU_STATIC_RELEASE_BASE_URL=/static/releases
            FOSU_DEPLOY_COMMIT_SHA=${COMMIT_SHA}
            FOSU_CLIENT_BUILD_ID=${{ steps.build_info.outputs.client_build_id || github.sha }}
            DATA_SOURCE_MODE=cache-first
            ADMIN_API_TOKEN=${{ secrets.ADMIN_API_TOKEN }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            ADMIN_TOKEN=${{ secrets.ADMIN_TOKEN }}
            FOSU_ADMIN_NEXT_WRITE_MODULES=content,feedback,audit,backups
            FOSU_CONFIG_HARD_FAIL=false
            FOSU_BASE_URL=https://100.fosu.edu.cn
            FOSU_AUTH_URL=https://authserver.fosu.edu.cn
            FOSU_AUTH_BASE=https://authserver.fosu.edu.cn
            FOSU_APAAS_BASE=https://apaas.fosu.edu.cn
            FOSU_IMPORT_TIMEOUT_MS=30000
            FOSU_IMPORT_PREVIEW_TTL_SECONDS=600
            FOSU_IMPORT_ENABLE=${{ vars.FOSU_IMPORT_ENABLE || 'true' }}
            FOSU_IMPORT_CHANNEL=${{ vars.FOSU_IMPORT_CHANNEL || 'auto' }}
            FOSU_CLOUDBASE_IMPORT_ENABLE=${{ vars.FOSU_CLOUDBASE_IMPORT_ENABLE || 'true' }}
            FOSU_CLOUDBASE_IMPORT_URL=${{ vars.FOSU_CLOUDBASE_IMPORT_URL || '' }}
            FOSU_IMPORT_CHANNEL_TIMEOUT_MS=${{ vars.FOSU_IMPORT_CHANNEL_TIMEOUT_MS || '25000' }}
            FOSU_IMPORT_ORACLE_FALLBACK=${{ vars.FOSU_IMPORT_ORACLE_FALLBACK || 'true' }}
            FOSU_IMPORT_CLOUDBASE_RELAY_TOKEN=${{ secrets.FOSU_IMPORT_CLOUDBASE_RELAY_TOKEN }}
            FOSU_IMPORT_USE_PLAYWRIGHT_FALLBACK=false
            FOSU_IMPORT_RATE_LIMIT_ENABLED=true
            FOSU_IMPORT_IP_RATE_LIMIT_10M=12
            CACHE_TTL_CATALOG=600
            CACHE_TTL_MAJOR=1800
            CACHE_TTL_SCHEDULE=600
            REQUEST_TIMEOUT_MS=15000
            CORS_ALLOWED_ORIGINS=https://class.katelya.eu.org,http://127.0.0.1:18318
            FOSU_ALLOWED_ADMIN_ORIGINS=https://class.katelya.eu.org
            FOSU_ALLOWED_PUBLIC_ORIGINS=
            FOSU_TRUSTED_PROXY_IPS=

            FOSU_SECURITY_MODE=${{ vars.FOSU_SECURITY_MODE || 'observe' }}
            FOSU_DYNAMIC_API_SESSION_REQUIRED=${{ vars.FOSU_DYNAMIC_API_SESSION_REQUIRED || 'false' }}
            WECHAT_APPID=${{ secrets.WECHAT_APPID }}
            WECHAT_APPSECRET=${{ secrets.WECHAT_APPSECRET }}
            FOSU_SESSION_SECRET_CURRENT=${{ secrets.FOSU_SESSION_SECRET_CURRENT }}
            FOSU_SESSION_SECRET_PREVIOUS=${{ secrets.FOSU_SESSION_SECRET_PREVIOUS }}
            FOSU_SESSION_SECRET_KID=${{ secrets.FOSU_SESSION_SECRET_KID }}
            FOSU_SESSION_TTL_SECONDS=${{ vars.FOSU_SESSION_TTL_SECONDS || '7200' }}
            FOSU_CSRF_SECRET=${{ secrets.FOSU_CSRF_SECRET }}
            FOSU_AGENT_MEMORY_SECRET=${{ secrets.FOSU_AGENT_MEMORY_SECRET }}
            FOSU_AGENT_REMINDER_SECRET=${{ secrets.FOSU_AGENT_REMINDER_SECRET }}
            FOSU_WECHAT_RECIPIENT_SECRET=${{ secrets.FOSU_WECHAT_RECIPIENT_SECRET }}
            FOSU_COURSE_REMINDER_DISPATCH_ENABLED=${{ vars.FOSU_COURSE_REMINDER_DISPATCH_ENABLED || 'false' }}
            FOSU_COURSE_REMINDER_DISPATCH_INTERVAL_MS=${{ vars.FOSU_COURSE_REMINDER_DISPATCH_INTERVAL_MS || '60000' }}
            WECHAT_COURSE_REMINDER_TEMPLATE_ID=${{ vars.WECHAT_COURSE_REMINDER_TEMPLATE_ID || '' }}
            WECHAT_COURSE_REMINDER_DATA_FIELDS_JSON=${{ vars.WECHAT_COURSE_REMINDER_DATA_FIELDS_JSON || '' }}
            WECHAT_REMINDER_MINIPROGRAM_STATE=${{ vars.WECHAT_REMINDER_MINIPROGRAM_STATE || 'formal' }}
            WECHAT_REMINDER_TIMEOUT_MS=${{ vars.WECHAT_REMINDER_TIMEOUT_MS || '5000' }}

            OPENRESTY_HOST_RELEASE_DIR=/opt/1panel/www/sites/class.katelya.eu.org/index/static/releases
            OPENRESTY_HOST_RUNTIME_DIR=/opt/1panel/www/sites/class.katelya.eu.org/index/static/runtime
            STATIC_RELEASE_SYNC_ENABLED=true
            RELEASE_PACK_SRC=/app/storage/public/releases
            OPENRESTY_STATIC_RELEASE_DIR=/openresty-static/releases
            OPENRESTY_STATIC_RUNTIME_DIR=/openresty-static/runtime
            PUBLIC_BASE_URL=https://class.katelya.eu.org/static/releases
            STATIC_RELEASE_KEEP_LATEST=3
            STATIC_RELEASE_SYNC_VERIFY_HTTP=true
            STATIC_RELEASE_SYNC_HTTP_TIMEOUT_MS=8000
            STATIC_RELEASE_VERIFY_CONCURRENCY=2
            FOSU_STATIC_ACCESS_MODE=${{ vars.FOSU_STATIC_ACCESS_MODE || 'public' }}
            FOSU_OPENRESTY_STATIC_SECURITY_MODE=${{ vars.FOSU_OPENRESTY_STATIC_SECURITY_MODE || 'public' }}
            FOSU_STATIC_TICKET_SECRET_CURRENT=${{ secrets.FOSU_STATIC_TICKET_SECRET_CURRENT }}
            FOSU_STATIC_TICKET_SECRET_PREVIOUS=${{ secrets.FOSU_STATIC_TICKET_SECRET_PREVIOUS }}
            FOSU_STATIC_TICKET_SECRET_KID=${{ secrets.FOSU_STATIC_TICKET_SECRET_KID }}
            FOSU_STATIC_TICKET_TTL_SECONDS=${{ vars.FOSU_STATIC_TICKET_TTL_SECONDS || '600' }}
            FOSU_STATIC_TICKET_CACHE_MAX=500

            FOSU_RELEASE_WORKER_ENABLED=true
            FOSU_RELEASE_WORKER_MAX_OLD_SPACE_MB=3072
            FOSU_RELEASE_PRECOMPRESS=gzip
            FOSU_RELEASE_BROTLI_ENABLED=false
            FOSU_RELEASE_COMPRESSION_CONCURRENCY=1
            FOSU_JSON_BODY_LIMIT=2mb
            FOSU_LARGE_JSON_BODY_LIMIT=30mb
            FOSU_PERSONAL_XLS_BODY_LIMIT=20mb
            FOSU_URLENCODED_BODY_LIMIT=1mb
            FOSU_RAW_UPLOAD_BODY_LIMIT=150mb
            FOSU_STAGING_CHUNK_BODY_LIMIT=12mb
            FOSU_API_CPUS=1.5
            FOSU_API_MEM_LIMIT=4096m

            FOSU_MAINTENANCE_ENABLED=true
            FOSU_MAINTENANCE_INTERVAL_HOURS=24
            FOSU_MAINTENANCE_START_DELAY_MS=60000
            FOSU_RELEASE_RETENTION_COUNT=3
            FOSU_RELEASE_RETENTION_DAYS=30
            FOSU_JOB_SUCCESS_RETENTION_DAYS=14
            FOSU_JOB_FAILED_RETENTION_DAYS=30
            FOSU_STAGING_FILE_RETENTION_DAYS=14
            FOSU_ARCHIVE_METADATA_RETENTION_DAYS=90
            FOSU_TEMP_RETENTION_HOURS=24
            FOSU_LOG_RETENTION_DAYS=30
            FOSU_LOG_ROTATE_SIZE_MB=10
            FOSU_DISK_WARNING_PERCENT=80
            FOSU_DISK_CRITICAL_PERCENT=90
            FOSU_MIN_FREE_DISK_GB=5
            EOF
            {
              printf '\n# AI Provider\n'
            } >> "$tmp_env"
            append_ai_env "AI_AGENT_ENABLED" "${{ vars.AI_AGENT_ENABLED }}" "false"
            append_ai_env "AI_PROVIDER" "${{ vars.AI_PROVIDER }}" "mock"
            append_ai_env "AI_PROVIDER_POLICY" "${{ vars.AI_PROVIDER_POLICY }}" "auto"
            append_ai_env "AI_RUNTIME_MODE" "${{ vars.AI_RUNTIME_MODE }}" "public"
            append_ai_env "AI_PROVIDER_ACTIVE_ENV" "${{ vars.AI_PROVIDER_ACTIVE_ENV }}" "public"
            append_ai_env "AI_COMPETITION_ALLOW_TRIAL_ENV" "${{ vars.AI_COMPETITION_ALLOW_TRIAL_ENV }}" "true"
            append_ai_env "AI_MODEL" "${{ vars.AI_MODEL }}" "deepseek-v4-flash"
            append_ai_env "AI_REASONING_MODEL" "${{ vars.AI_REASONING_MODEL }}" "deepseek-v4-pro"
            append_ai_env "AI_BASE_URL" "${{ vars.AI_BASE_URL }}" "https://api.deepseek.com"
            append_ai_env "AI_TIMEOUT_MS" "${{ vars.AI_TIMEOUT_MS }}" "15000"
            append_ai_env "AI_MAX_TOKENS" "${{ vars.AI_MAX_TOKENS }}" "1200"
            append_ai_env "AI_TEMPERATURE" "${{ vars.AI_TEMPERATURE }}" "0.1"
            append_ai_env "AI_THINKING_ENABLED" "${{ vars.AI_THINKING_ENABLED }}" "false"
            append_ai_env "AI_REASONING_EFFORT" "${{ vars.AI_REASONING_EFFORT }}" "medium"
            append_ai_env "AI_PROVIDER_JSON_REPAIR" "${{ vars.AI_PROVIDER_JSON_REPAIR }}" "true"
            append_ai_env "DEEPSEEK_STRICT_JSON_MODE" "${{ vars.DEEPSEEK_STRICT_JSON_MODE }}" "false"
            append_ai_env "AI_ALLOW_PERSONAL_CONTEXT" "${{ vars.AI_ALLOW_PERSONAL_CONTEXT }}" "false"
            append_ai_env "FOSU_AI_CONFIG_ENCRYPTION_KEY" "${{ secrets.FOSU_AI_CONFIG_ENCRYPTION_KEY }}" ""
            append_ai_env "AI_API_KEY" "${{ secrets.AI_API_KEY }}" ""
            append_ai_env "DEEPSEEK_API_KEY" "${{ secrets.DEEPSEEK_API_KEY }}" ""
            append_ai_env "CLOUDBASE_OPENAI_ENABLED" "${{ vars.CLOUDBASE_OPENAI_ENABLED }}" "false"
            append_ai_env "CLOUDBASE_OPENAI_BASE_URL" "${{ vars.CLOUDBASE_OPENAI_BASE_URL }}" "https://cloud1-d3g17rpe7566d3d5c.api.tcloudbasegateway.com/v1/ai/cloudbase"
            append_ai_env "CLOUDBASE_OPENAI_API_KEY" "${{ secrets.CLOUDBASE_OPENAI_API_KEY }}" ""
            append_ai_env "CLOUDBASE_OPENAI_TEXT_MODEL" "${{ vars.CLOUDBASE_OPENAI_TEXT_MODEL }}" "hy3-preview"
            append_ai_env "CLOUDBASE_OPENAI_TIMEOUT_MS" "${{ vars.CLOUDBASE_OPENAI_TIMEOUT_MS }}" "15000"
            append_ai_env "CLOUDBASE_OPENAI_MAX_TOKENS" "${{ vars.CLOUDBASE_OPENAI_MAX_TOKENS }}" "1200"
            append_ai_env "COZE_API_BASE_URL" "${{ vars.COZE_API_BASE_URL }}" "https://api.coze.cn"
            append_ai_env "COZE_API_KEY" "${{ secrets.COZE_API_KEY }}" ""
            append_ai_env "COZE_BOT_ID" "${{ vars.COZE_BOT_ID }}" ""
            append_ai_env "COZE_CHAT_ENDPOINT" "${{ vars.COZE_CHAT_ENDPOINT }}" "/v3/chat"
            append_ai_env "COZE_POLL_ENABLED" "" "true"
            append_ai_env "COZE_POLL_INTERVAL_MS" "" "1000"
            append_ai_env "COZE_POLL_MAX_ATTEMPTS" "" "8"
            chmod 600 "$tmp_env"

            required_env_keys=(
              NODE_ENV
              PORT
              ADMIN_API_TOKEN
              ADMIN_PASSWORD
              OPENRESTY_HOST_RELEASE_DIR
              OPENRESTY_HOST_RUNTIME_DIR
              STATIC_RELEASE_SYNC_ENABLED
              RELEASE_PACK_SRC
              OPENRESTY_STATIC_RELEASE_DIR
              OPENRESTY_STATIC_RUNTIME_DIR
              PUBLIC_BASE_URL
              STATIC_RELEASE_KEEP_LATEST
              STATIC_RELEASE_SYNC_VERIFY_HTTP
              FOSU_STATIC_ACCESS_MODE
              FOSU_SECURITY_MODE
              FOSU_DYNAMIC_API_SESSION_REQUIRED
              FOSU_OPENRESTY_STATIC_SECURITY_MODE
              FOSU_AI_CONFIG_ENCRYPTION_KEY
              FOSU_RELEASE_WORKER_ENABLED
              FOSU_RELEASE_WORKER_MAX_OLD_SPACE_MB
              FOSU_RELEASE_PRECOMPRESS
              FOSU_RELEASE_BROTLI_ENABLED
              FOSU_RELEASE_COMPRESSION_CONCURRENCY
              FOSU_MAINTENANCE_ENABLED
              FOSU_RELEASE_RETENTION_COUNT
              FOSU_LOG_ROTATE_SIZE_MB
              FOSU_DISK_WARNING_PERCENT
              FOSU_DISK_CRITICAL_PERCENT
              FOSU_MIN_FREE_DISK_GB
            )
            for key in "${required_env_keys[@]}"; do
              if ! grep -q "^${key}=" "$tmp_env"; then
                echo "::error::.env is missing required key: ${key}"
                rm -f "$tmp_env"
                exit 1
              fi
            done
            if ! grep -q '^ADMIN_API_TOKEN=.\+' "$tmp_env"; then
              echo "::error::.env missing non-empty ADMIN_API_TOKEN"
              rm -f "$tmp_env"
              exit 1
            fi
            effective_security_mode="$(grep '^FOSU_SECURITY_MODE=' "$tmp_env" | cut -d= -f2-)"
            if [ "$effective_security_mode" != "observe" ]; then
              for key in WECHAT_APPID WECHAT_APPSECRET FOSU_SESSION_SECRET_CURRENT; do
                if ! grep -q "^${key}=.\+" "$tmp_env"; then
                  echo "::error::.env missing ${key} for security mode ${effective_security_mode}"
                  rm -f "$tmp_env"
                  exit 1
                fi
              done
            fi
            if { [ "$effective_security_mode" = "ticket" ] || [ "$effective_security_mode" = "ticket-enforce" ]; } && ! grep -q '^FOSU_STATIC_TICKET_SECRET_CURRENT=.\+' "$tmp_env"; then
              echo "::error::.env missing FOSU_STATIC_TICKET_SECRET_CURRENT for ticket mode"
              rm -f "$tmp_env"
              exit 1
            fi
            mv "$tmp_env" .env

            node -e "require('./src/services/ai/providerRuntimeConfigStore'); console.log('ai runtime config store ok')"
            sudo docker compose config >/dev/null
            sudo docker compose up -d --build

            container_id="$(sudo docker ps -aqf "name=^/${CONTAINER_NAME}$")"
            if [ -z "$container_id" ]; then
              echo "::error::${CONTAINER_NAME} does not exist after docker compose up"
              exit 1
            fi

            for i in $(seq 1 30); do
              container_state="$(sudo docker inspect -f '{{.State.Status}}' "$CONTAINER_NAME")"
              if [ "$container_state" = "running" ]; then
                break
              fi
              echo "Waiting for ${CONTAINER_NAME} to run... (${i}/30, status=${container_state})"
              sleep 1
            done

            sudo docker exec "$CONTAINER_NAME" sh -lc 'node -e "require(\"./src/services/ai/providerRuntimeConfigStore\"); require(\"./src/services/ai/agentService\"); console.log(\"ai runtime ok\")"'

            container_health="unknown"
            unhealthy_count=0
            for i in $(seq 1 60); do
              container_health="$(sudo docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER_NAME")"
              if [ "$container_health" = "healthy" ] || [ "$container_health" = "running" ]; then
                if curl -fsS http://127.0.0.1:18318/api/health >/dev/null; then
                  break
                fi
              fi
              if [ "$container_health" = "unhealthy" ]; then
                unhealthy_count=$((unhealthy_count + 1))
                if [ "$unhealthy_count" -ge 5 ]; then
                  echo "Recent healthcheck log after ${unhealthy_count} unhealthy checks:"
                  sudo docker inspect "$CONTAINER_NAME" --format '{{range .State.Health.Log}}{{println .Output}}{{end}}' 2>&1 | tail -n 10 | bash "$GUARD" sanitize || true
                  unhealthy_count=0
                fi
              else
                unhealthy_count=0
              fi
              echo "Waiting for ${CONTAINER_NAME} health... (${i}/60, status=${container_health})"
              sleep 2
            done

            if ! curl -fsS http://127.0.0.1:18318/api/health >/dev/null; then
              echo "::error::http://127.0.0.1:18318/api/health failed"
              exit 1
            fi
            sudo docker exec "$CONTAINER_NAME" node -e 'const f=require("fs"),x=m=>{throw Error(m)};Promise.all([fetch("http://127.0.0.1:3000/api/admin/ui-mode"),fetch("http://127.0.0.1:3000/admin-next/sync",{redirect:"manual"}),fetch("http://127.0.0.1:3000/admin-legacy/sync",{redirect:"manual"})]).then(async([u,n,l])=>{u=await u.json();if(u.primary!=="legacy"||u.effectivePrimary!=="legacy"||u.adminNextEnabled!==false)x("ui-mode");if([n,l].some(r=>r.status!==302||r.headers.get("location")!=="/admin/sync"))x("redirect");if(f.existsSync("/app/public/admin-app"))x("admin-app");console.log("legacy-admin-ok")}).catch(e=>{console.error(e);process.exit(1)})'
            admin_unauth_status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18318/api/admin/publisher/receipt || true)"
            if [ "$admin_unauth_status" != "401" ]; then
              echo "::error::protected admin publisher receipt API without token returned HTTP ${admin_unauth_status}, expected 401"
              exit 1
            fi
            sudo docker exec "$CONTAINER_NAME" node -e 'const fail=m=>{console.error("admin token smoke failed: "+m);process.exit(1)},t=process.env.ADMIN_API_TOKEN;if(!t)fail("empty ADMIN_API_TOKEN");fetch("http://127.0.0.1:3000/api/admin/publisher/receipt",{headers:{"X-Admin-Token":t}}).then(async r=>{let b;try{b=await r.json()}catch{fail("invalid JSON")}if(r.status!==200)fail("HTTP "+r.status);if(b?.success!==true)fail("success flag")}).catch(()=>fail("request failed"))'
            echo "admin-api-token-contract=ok"
            bootstrap_status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:18318/api/fosu/session/bootstrap || true)"
            if [ "$bootstrap_status" = "404" ] || [ "$bootstrap_status" = "000" ]; then
              echo "::error::session bootstrap route is unavailable: HTTP ${bootstrap_status}"
              exit 1
            fi

            restart_after="$(sudo docker inspect -f '{{.RestartCount}}' "$CONTAINER_NAME")"
            if [ "$restart_after" -gt $((restart_before + 1)) ]; then
              echo "::error::Container restartCount increased unexpectedly: before=${restart_before}, after=${restart_after}"
              exit 1
            fi

            sudo docker exec "$CONTAINER_NAME" sh -lc 'test -d /app/storage && test -w /app/storage && test -d /openresty-static/releases && test -w /openresty-static/releases && test -d /openresty-static/runtime && test -w /openresty-static/runtime'
            sudo docker exec "$CONTAINER_NAME" sh -lc 'test "$STATIC_RELEASE_SYNC_ENABLED" = "true" && test "$RELEASE_PACK_SRC" = "/app/storage/public/releases" && test "$OPENRESTY_STATIC_RELEASE_DIR" = "/openresty-static/releases" && test "$OPENRESTY_STATIC_RUNTIME_DIR" = "/openresty-static/runtime" && test "$PUBLIC_BASE_URL" = "https://class.katelya.eu.org/static/releases" && test "$FOSU_RELEASE_WORKER_ENABLED" = "true" && test "$FOSU_RELEASE_WORKER_MAX_OLD_SPACE_MB" = "3072"'
            sudo docker exec "$CONTAINER_NAME" sh -lc 'node -e "const s=require(\"./src/services/securityModeService\").getSecurityStatus(); if(!s.mode) process.exit(1); console.log(\"security_mode=\"+s.mode)"'
            sudo docker exec "$CONTAINER_NAME" sh -lc 'node scripts/security-postdeploy-check.js --base-url=http://127.0.0.1:3000'
            sudo docker exec "$CONTAINER_NAME" sh -lc 'node scripts/verify-ai-provider.js --mode=status' 2>&1 | bash "$GUARD" sanitize

            sudo docker exec "$CONTAINER_NAME" sh -lc 'node scripts/reconcile-static-release.js > /tmp/fosu-static-reconcile.json'
            read_reconcile() {
              sudo docker exec "$CONTAINER_NAME" node -e 'const d=require("/tmp/fosu-static-reconcile.json").staticSync||{},v=process.argv[1].split(".").reduce((o,k)=>o?.[k],d);process.stdout.write(Array.isArray(v)?v.join(","):String(v??""))' "$1"
            }
            active_release="$(read_reconcile releaseVersion)"
            synced_release="$(read_reconcile syncedReleaseVersion)"
            files_copied="$(read_reconcile filesCopied)"
            retained_releases="$(read_reconcile retainedReleases)"
            runtime_status_from_reconcile="$(read_reconcile runtimeActiveStatus)"
            if [ -z "$runtime_status_from_reconcile" ]; then
              runtime_status_from_reconcile="$(read_reconcile verifiedRuntimeUrl.status)"
            fi

            if [ -z "$active_release" ]; then
              echo "::error::No active release found during postdeploy static reconcile"
              exit 1
            fi
            sudo docker exec "$CONTAINER_NAME" sh -lc 'test -f /app/storage/public/runtime/active.json && test -f /openresty-static/runtime/active.json'

            verify_url() {
              local relative_path="$1"
              local url="${PUBLIC_BASE_URL}/${active_release}/${relative_path}"
              local status
              status="$(curl -L -sS -o /dev/null -w '%{http_code}' -I --max-time 10 "$url" || true)"
              if [ "$status" = "403" ] || [ "$status" = "405" ] || [ "$status" = "501" ] || [ "$status" = "000" ]; then
                status="$(curl -L -sS -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-0' --max-time 10 "$url" || true)"
              fi
              if [ "$status" != "200" ] && [ "$status" != "206" ]; then
                echo "::error::Static URL verification failed: ${relative_path} HTTP ${status}"
                exit 1
              fi
              printf '%s:%s ' "$relative_path" "$status"
            }

            url_status=""
            runtime_status="$(curl -L -sS -o /dev/null -w '%{http_code}' -I --max-time 10 "https://class.katelya.eu.org/static/runtime/active.json" || true)"
            if [ "$runtime_status" = "403" ] || [ "$runtime_status" = "405" ] || [ "$runtime_status" = "501" ] || [ "$runtime_status" = "000" ]; then
              runtime_status="$(curl -L -sS -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-0' --max-time 10 "https://class.katelya.eu.org/static/runtime/active.json" || true)"
            fi
            if [ "$runtime_status" != "200" ] && [ "$runtime_status" != "206" ]; then
              echo "::error::Static runtime verification failed: active.json HTTP ${runtime_status}"
              exit 1
            fi
            url_status="${url_status}$(verify_url manifest.json)"
            url_status="${url_status}$(verify_url index/class/all.json)"
            url_status="${url_status}$(verify_url empty-room/index.json)"

            elapsed="$(( $(date +%s) - STARTED_AT ))"
            echo "================================"
            echo "Deployment summary"
            echo "================================"
            echo "commit_sha=${COMMIT_SHA}"
            echo "container_health=${container_health}"
            echo "active_release=${active_release}"
            echo "synced_release=${synced_release}"
            echo "files_copied=${files_copied}"
            echo "retained_releases=${retained_releases}"
            echo "runtime_status=${runtime_status} reconcile=${runtime_status_from_reconcile}"
            echo "url_status=${url_status}"
            echo "elapsed_seconds=${elapsed}"
            echo "================================"

            # Record verified production version markers (read by next pre-backup).
            bash scripts/deploy-guard.sh post "$APP_DIR" "$CONTAINER_NAME" "$COMMIT_SHA"

      - name: Show Deployment Info
        run: |
          echo "Deployment completed for commit ${{ github.sha }}"
          echo "Container: fosuclass-api"
          echo "Health: http://127.0.0.1:18318/api/health"
          echo "Public API: https://class.katelya.eu.org"
          echo "Static releases: https://class.katelya.eu.org/static/releases"

      - name: Configure and verify Coze workload
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.configure_coze_workload }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd '${{ secrets.VPS_APP_DIR }}/server'
            echo "=== configure ==="
            sudo docker exec -e COZE_WORKLOAD_ENDPOINT='${{ vars.COZE_WORKLOAD_ENDPOINT }}' -e COZE_PROJECT_ID='${{ vars.COZE_PROJECT_ID }}' fosuclass-api sh -lc 'node scripts/configure-coze-workload.js --verify'
            echo "=== store digest (sanitized, booleans only) ==="
            sudo docker exec fosuclass-api node -e '
              const store = require("/app/src/services/ai/providerRuntimeConfigStore");
              const cfg = store.readRuntimeConfig() || {};
              let profiles = {};
              try { profiles = JSON.parse(cfg.AI_PROVIDER_ENVIRONMENTS || "{}"); } catch (e) { profiles = { parseError: true }; }
              const out = {};
              for (const [name, p] of Object.entries(profiles)) {
                out[name] = {
                  provider: p.provider || null,
                  enabled: p.enabled !== false,
                  runtimeMode: p.runtimeMode || null,
                  cozeApiMode: p.cozeApiMode || null,
                  hasCozeEndpoint: Boolean(p.cozeWorkloadEndpoint),
                  hasCozeProjectId: Boolean(p.cozeProjectId),
                  chain: p.providerChain || null,
                };
              }
              console.log(JSON.stringify({
                activeEnv: cfg.AI_PROVIDER_ACTIVE_ENV || null,
                runtimeVersion: cfg.AI_PROVIDER_RUNTIME_VERSION || null,
                flatHasCozeKey: Boolean(cfg.COZE_API_KEY),
                flatCozeMode: cfg.COZE_API_MODE || null,
                profiles: out,
              }));
            '
            echo "=== fresh-process readiness (trial) ==="
            sudo docker exec fosuclass-api node -e '
              const readiness = require("/app/src/services/ai/providerReadinessService");
              const r = readiness.evaluateEnvironment("trial");
              console.log(JSON.stringify({ provider: r.provider, keyConfigured: r.keyConfigured, reasonCode: r.reasonCode, coze: r.coze }));
            '
            echo "=== container env presence (sanitized) ==="
            sudo docker exec fosuclass-api sh -lc 'for k in COZE_API_KEY COZE_API_MODE COZE_WORKLOAD_ENDPOINT COZE_PROJECT_ID COZE_BOT_ID COZE_CHAT_ENDPOINT AI_PROVIDER AI_PROVIDER_ACTIVE_ENV CLOUDBASE_OPENAI_API_KEY CLOUDBASE_OPENAI_ENABLED; do if [ -n "$(printenv $k)" ]; then echo "$k=SET"; else echo "$k=unset"; fi; done'
            echo "=== readiness BEFORE restart (develop) ==="
            curl -s http://127.0.0.1:18318/api/ai/agent/readiness -H "X-Fosu-Env-Version: develop" || true
            echo ""
            echo "=== restart container ==="
            sudo docker restart fosuclass-api
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:18318/api/health >/dev/null 2>&1; then break; fi
              sleep 2
            done
            echo "=== readiness AFTER restart (develop) ==="
            curl -s http://127.0.0.1:18318/api/ai/agent/readiness -H "X-Fosu-Env-Version: develop" || true
            echo ""

      - name: Configure and probe CloudBase Hunyuan (cloudbase-openai)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.configure_cloudbase_openai }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd '${{ secrets.VPS_APP_DIR }}/server'
            echo "=== configure cloudbase-openai credentials (primary unchanged) ==="
            sudo docker exec -e CLOUDBASE_OPENAI_API_KEY='${{ secrets.CLOUDBASE_OPENAI_API_KEY }}' fosuclass-api sh -lc 'node scripts/configure-cloudbase-openai.js'
            echo "=== probe cloudbase-openai gateway (non-fatal) ==="
            sudo docker exec -e CLOUDBASE_OPENAI_API_KEY='${{ secrets.CLOUDBASE_OPENAI_API_KEY }}' fosuclass-api sh -lc 'node scripts/configure-cloudbase-openai.js --verify' || true

      - name: Diagnose provider resolution (sanitized)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose_providers }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd '${{ secrets.VPS_APP_DIR }}/server'
            sudo docker exec fosuclass-api sh -lc 'node scripts/diagnose-provider.js --probe'

      - name: Configure and verify deepseek key + stage assignments
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.configure_deepseek }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd '${{ secrets.VPS_APP_DIR }}/server'
            sudo docker exec -e DEEPSEEK_API_KEY='${{ secrets.DEEPSEEK_API_KEY }}' fosuclass-api sh -lc 'node scripts/configure-deepseek.js --verify'
            echo "=== readiness after configure (develop) ==="
            curl -s http://127.0.0.1:18318/api/ai/agent/readiness -H "X-Fosu-Env-Version: develop" || true
            echo ""

      - name: E2E verify custom OpenAI-compatible provider
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_custom_openai }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd '${{ secrets.VPS_APP_DIR }}/server'
            sudo docker exec -e DEEPSEEK_API_KEY='${{ secrets.DEEPSEEK_API_KEY }}' fosuclass-api sh -lc 'node scripts/verify-custom-provider.js'
