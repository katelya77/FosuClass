name: Admin CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/admin-modernization-ci.yml"
      - ".github/workflows/deploy-vps.yml"
      - ".github/workflows/container-publish.yml"
      - "server/config/admin-rollout-manifest.json"
      - "server/src/**"
      - "server/Dockerfile"
      - "server/docker-compose*.yml"
      - "server/scripts/*runtime-data.js"
      - "server/scripts/verify-runtime-persistence.js"
      - "tools/test-admin*.js"
      - "tools/check-admin*.js"
      - "tools/capture-legacy-sync-compact.js"
      - "tools/test-exclusive-file-lock.js"
      - "tools/test-deploy-static-env-contract.js"
      - "tools/test-runtime*.js"
      - "docs/admin-migration/**"
      - "docs/adr/0002-vue3-admin-spa.md"
      - "tools/test-architecture-guards.js"
      - "tools/test-service-token*.js"
      - "tools/test-chunk-upload-csrf.js"
      - "tools/test-snapshot-concurrency.js"
      - "tools/test-config*.js"
      - "tools/test-duplicate-admin-routes.js"
      - "tools/test-staging-upload.js"
      - "package.json"
  push:
    branches: [main]

jobs:
  admin-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root deps
        run: npm ci || npm install

      - name: Install server deps
        run: npm --prefix server ci || npm --prefix server install

      - name: Architecture & admin contracts
        run: |
          npm run test:architecture-guards
          npm run test:admin-legacy-only
          npm run test:admin-capabilities
          npm run test:admin-rollout-runtime-contract
          npm run test:admin-backup-service
          npm run test:admin-backup-transaction
          npm run test:admin-content-concurrency
          npm run test:admin-write-parity
          npm run test:admin-http-write-parity
          npm run test:admin-c1-http
          npm run test:admin-c1-modules
          npm run test:exclusive-file-lock
          npm run test:duplicate-admin-routes
          npm run test:service-token-scopes
          npm run test:service-token-route-matrix
          npm run test:chunk-upload-csrf
          npm run test:snapshot-concurrency
          npm run test:admin-api-contract
          npm run test:admin-auth-modes
          npm run test:admin-page
          npm run test:admin-inline-script
          npm run test:admin-operations-studio-ui
          npm run test:admin-sync-page
          npm run test:staging-upload
          npm run test:runtime-data-bootstrap
          npm run test:runtime-data-migration
          npm run test:runtime-data-paths
          npm run test:runtime-compose-contract
          npm run test:runtime-persistence-verifier
          npm run test:deploy-static-env-contract
          npm run test:docker-secret-scan
          npm run test:config-migration-safe

      - name: Config and release preflight
        run: |
          npm run config:preflight
          npm run release:preflight

      - name: Security acceptance
        run: npm run security:acceptance

      - name: Docker smoke
        run: npm run test:server-docker-smoke

      - name: Legacy sync browser acceptance
        run: npm run test:admin-sync-browser

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-sync-compact
          path: output/legacy-sync-compact/
          if-no-files-found: warn
