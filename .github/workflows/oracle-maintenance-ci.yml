name: Oracle controlled maintenance CI
on:
  pull_request:
    paths:
      - '.github/workflows/oracle-maintenance-ci.yml'
      - 'deploy/oracle-runtime-cutover/**'
      - 'deploy/collector-closure/**'
      - 'deploy/oracle-sample/maintenance.js'
      - 'deploy/oracle-sample/preflight-adapter.js'
      - 'deploy/oracle-sample/verify-source.py'
      - 'deploy/oracle-sample/verify-image.py'
      - 'tools/oracle-sample/maintenance-admin.js'
      - 'tools/oracle-sample/loopback-http.js'
      - 'tools/oracle-sample/recover-orphan-job.js'
      - 'tools/oracle-sample/test_verify_source.py'
      - 'tools/oracle-sample/test_verify_image.py'
      - 'tools/test-oracle-runtime-cutover.js'
      - 'tools/test-oracle-loopback-http.js'
      - 'tools/test-oracle-persistence-acceptance.js'
      - 'tools/test-oracle-sample-preflight-adapter.js'
      - 'tools/test-oracle-sample-maintenance.js'
      - 'tools/test-oracle-sample-deploy-maintenance.js'
      - 'tools/test-collector-closure-window.js'
      - 'tools/test-oracle-orphan-job.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maintenance-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix server ci --no-audit --no-fund
      - name: Offline migration, recovery, admission and Sample gates
        env:
          NODE_OPTIONS: --require=./tools/fixture-network-only.js
        run: |
          # Root-only evidence ownership is part of the production contract.
          # Exercise it with real root-owned offline fixtures, never weaken it.
          sudo env "PATH=$PATH" "NODE_OPTIONS=--require=$PWD/tools/fixture-network-only.js" node --test tools/test-oracle-runtime-cutover.js tools/test-oracle-persistence-acceptance.js tools/test-oracle-sample-maintenance.js tools/test-oracle-sample-deploy-maintenance.js tools/test-oracle-sample-preflight-adapter.js
          node --test tools/test-oracle-loopback-http.js
          node tools/test-collector-closure-window.js
          node --test tools/test-oracle-orphan-job.js
          python3 tools/oracle-sample/test_verify_source.py
          python3 tools/oracle-sample/test_verify_image.py
          node --check deploy/oracle-runtime-cutover/execute.js
          node --check deploy/oracle-sample/maintenance.js
          node --check deploy/oracle-sample/preflight-adapter.js
          node --check deploy/oracle-runtime-cutover/lifecycle-guard.js
          bash -n deploy/collector-closure/start-wyz.sh
          git diff --check
