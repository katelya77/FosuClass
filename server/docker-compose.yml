services:
  fosu-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fosuclass-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FOSU_JSON_BODY_LIMIT: ${FOSU_JSON_BODY_LIMIT:-2mb}
      FOSU_LARGE_JSON_BODY_LIMIT: ${FOSU_LARGE_JSON_BODY_LIMIT:-30mb}
      FOSU_PERSONAL_XLS_BODY_LIMIT: ${FOSU_PERSONAL_XLS_BODY_LIMIT:-20mb}
      FOSU_URLENCODED_BODY_LIMIT: ${FOSU_URLENCODED_BODY_LIMIT:-1mb}
      FOSU_RAW_UPLOAD_BODY_LIMIT: ${FOSU_RAW_UPLOAD_BODY_LIMIT:-150mb}
      FOSU_STAGING_CHUNK_BODY_LIMIT: ${FOSU_STAGING_CHUNK_BODY_LIMIT:-12mb}
      FOSU_RELEASE_WORKER_ENABLED: ${FOSU_RELEASE_WORKER_ENABLED:-true}
      FOSU_RELEASE_WORKER_MAX_OLD_SPACE_MB: ${FOSU_RELEASE_WORKER_MAX_OLD_SPACE_MB:-3072}
      FOSU_RELEASE_COMPRESSION_CONCURRENCY: ${FOSU_RELEASE_COMPRESSION_CONCURRENCY:-1}
    cpus: ${FOSU_API_CPUS:-1.5}
    mem_limit: ${FOSU_API_MEM_LIMIT:-4096m}
    ports:
      # 将端口绑定限制在 HOST_BIND_IP 宿主机本地环回 IP，防范公网安全风险
      - "${HOST_BIND_IP:-127.0.0.1}:${HOST_API_PORT:-18318}:${PORT:-3000}"
    volumes:
      - ./storage:/app/storage
      - ${OPENRESTY_HOST_RELEASE_DIR:-/opt/1panel/www/sites/class.katelya.eu.org/index/static/releases}:/openresty-static/releases
      - ${OPENRESTY_HOST_RUNTIME_DIR:-/opt/1panel/www/sites/class.katelya.eu.org/index/static/runtime}:/openresty-static/runtime
    healthcheck:
      test: ["CMD", "node", "scripts/test-health.js"]
      start_period: 20s
      interval: 30s
      timeout: 10s
      retries: 3
