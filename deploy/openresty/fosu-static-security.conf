# FosuClass static Release Pack security include.
# Include this inside the 1Panel site server {} block after backing up the current config.

set $fosu_static_security_mode public;

location ^~ /static/runtime/ {
    autoindex off;

    limit_except GET HEAD {
        deny all;
    }

    if ($uri ~* "(^|/)\.") { return 404; }
    if ($uri ~ "%00|%2e%2e|%252e|\\") { return 400; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'" always;
    add_header Cache-Control "public, max-age=30, stale-while-revalidate=300" always;

    alias /openresty-static/runtime/;
    try_files $uri =404;
}

location ^~ /static/releases/ {
    autoindex off;

    limit_except GET HEAD {
        deny all;
    }

    if ($uri ~* "(^|/)\.") { return 404; }
    if ($uri ~* "\.(env|bak|sql|zip|tar|gz|log|map|tmp|swp)$") { return 404; }
    if ($uri ~* "(^|/)(backup|backups|\.git)(/|$)") { return 404; }
    if ($uri ~ "%00|%2e%2e|%252e|\\") { return 400; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'" always;

    # public/observe mode keeps immutable caching.
    add_header Cache-Control "public, max-age=31536000, immutable" always;

    # Ticket mode should be enabled only after HMAC verification is installed.
    # Preferred: access_by_lua_block validates X-Fosu-Static-Ticket locally.
    # Fallback: auth_request to an internal endpoint with proxy_cache and <= 300ms timeout.

    alias /openresty-static/releases/;
    try_files $uri =404;
}
