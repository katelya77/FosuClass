server {
  listen 443 ssl;
  server_name agent-broker.katelya.eu.org;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/agent-broker.katelya.eu.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/agent-broker.katelya.eu.org/privkey.pem;

  client_max_body_size 3m;
  autoindex off;

  location /api/campus-agent/v1/ {
    proxy_pass http://127.0.0.1:18318;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }

  location / {
    return 404;
  }
}
